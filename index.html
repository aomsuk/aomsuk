<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOMSUK</title>
    <!-- โหลดไฟล์เวอร์ชันล่าสุดเสมอ (กันมือถือ/iPad ใช้ไฟล์เก่าที่จำไว้) -->
    <script>(function () { var v = ''; try { v = (localStorage.getItem('aomsuk_build') || '').slice(0, 7); } catch (e) { } var q = v ? '?v=' + v : ''; document.write('<script src="firebase-config.js' + q + '"><\/script><script src="app.js' + q + '"><\/script>'); })();</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 17px; } body, button, input, textarea, select { font-family: 'Google Sans', 'Noto Sans Thai Looped', sans-serif; }
        .pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
        .fade-up { animation: fadeUp .6s .2s ease-out both; }
        @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-[#d8eafe] h-screen flex flex-col justify-between">
    <div class="h-16 bg-[#9c8a7e]"></div> <!-- แถบสีน้ำตาลบน -->
    <div class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-piggy-bank text-white text-6xl mb-4 drop-shadow-md pop"></i>
        <h1 class="text-4xl font-bold text-[#9c8a7e] tracking-widest fade-up">AOMSUK</h1>
    </div>
    <div class="h-16 bg-[#9c8a7e]"></div> <!-- แถบสีน้ำตาลล่าง -->

    <!-- เด้งไปหน้าถัดไปภายใน 1.5 วินาที: ล็อกอินแล้ว -> ติดตาม, ยังไม่ล็อกอิน -> login -->
    <script>
        const t0 = Date.now();
        AOMSUK.authState().then(user => {
            const next = user ? 'dashboard.html' : 'login.html';
            setTimeout(() => AOMSUK.goReplace(next), Math.max(0, 1500 - (Date.now() - t0)));
        });
    </script>
</body>
</html>
