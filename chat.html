    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        // ==LOGIC START== ----------------------------------------------------
        // ส่วนวิเคราะห์ข้อความ (NLP แบบกฎ) + คำนวณตาราง — ไม่ต้องใช้ API ภายนอก

        const DAY_SHORT = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        const DAY_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const SUN = 'อาทิต[ย์]*(?![ย์])';
        const DAY_NAMES = 'จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|ศุกร|เสาร์|เสาร|อาทิต';

        // ---- วันที่ ----
        const dOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
        const addMonths = (d, n) => {
            const y = d.getFullYear(), m = d.getMonth() + n;
            const last = new Date(y, m + 1, 0).getDate();
            return new Date(y, m, Math.min(d.getDate(), last));
        };
        const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const fmtDate = (d, opt) => d.toLocaleDateString('th-TH', opt);
        const fmtMoney = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const round2 = n => Math.round(n * 100) / 100;

        function dayNameToNum(s) {
            if (/จันท/.test(s)) return 1; if (/อังคาร/.test(s)) return 2; if (/พุธ/.test(s)) return 3;
            if (/พฤหัส/.test(s)) return 4; if (/ศุกร/.test(s)) return 5; if (/เสาร/.test(s)) return 6;
            return 0;
        }

        // ---- ทำความสะอาดข้อความ ----
        function normalize(text) {
            const TH = '๐๑๒๓๔๕๖๗๘๙';
            let t = text.replace(/[๐-๙]/g, c => TH.indexOf(c)).toLowerCase();
            t = t.replace(/(\d),(?=\d{3})/g, '$1').replace(/(\d),(?=\d{3})/g, '$1');
            t = t.replace(/ครึ่ง\s*ปี/g, '6 เดือน').replace(/ครึ่ง\s*เดือน/g, '15 วัน');
            const W = { 'หนึ่ง': 1, 'สอง': 2, 'สาม': 3, 'สี่': 4, 'ห้า': 5, 'หก': 6, 'เจ็ด': 7, 'แปด': 8, 'เก้า': 9, 'สิบ': 10, 'สิบสอง': 12 };
            t = t.replace(/(สิบสอง|สิบ|หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า)\s*(?=(วัน|สัปดาห|อาทิต|เดือน|ปี))/g, w => W[w.trim()] + ' ');
            return t;
        }

        // หาชื่อวันในช่วงข้อความ
        function findDays(w) {
            const s = new Set(); let today = false;
            if (/วันหยุด|สุดสัปดาห์|weekend/.test(w)) { s.add(6); s.add(0); }
            if (/วันธรรมดา|วันทำงาน|weekday|จันทร์\s*(-|–|ถึง)\s*(วัน)?ศุกร์/.test(w)) [1, 2, 3, 4, 5].forEach(d => s.add(d));
            const P = [[1, /จันทร์|จันท|monday|mon(?![a-z])/], [2, /อังคาร|tuesday|tue(?![a-z])/], [3, /พุธ|wednesday|wed(?![a-z])/],
                [4, /พฤหัส|thursday|thu(?![a-z])/], [5, /ศุกร์|ศุกร|friday|fri(?![a-z])/], [6, /เสาร์|เสาร|saturday|sat(?![a-z])/]];
            P.forEach(([d, re]) => { if (re.test(w)) s.add(d); });
            const sunAfter = `${SUN}(?!\\s*(ละ|หน้า|นี้))`;
            if (new RegExp(`(วัน|เสาร์|เสาร|และ|,|/|-|–|หรือ|กับ)\\s*${sunAfter}`).test(w) || new RegExp(`^\\s*${sunAfter}`).test(w) || /sunday|sun(?![a-z])/.test(w)) s.add(0);
            if (/วันนี้|today/.test(w)) today = true;
            return { s, today };
        }

        const DELIM_SRC = 'แต่|ขอ|เฉพาะ|แค่|ภายใน|โดย|ให้|ส่วน|ออม|ไม่|เว้น|งด|ข้าม|เริ่ม|ตั้งแต่|มากกว่า|น้อยกว่า|เยอะ|,|\\.|\\n|\\d';
        function fwd(t, i) { const w = t.slice(i, i + 40); const m = w.search(new RegExp(DELIM_SRC)); return m >= 0 ? w.slice(0, m) : w; }
        function bwd(t, i) {
            const w = t.slice(Math.max(0, i - 30), i); let last = -1, mm; const re = new RegExp(DELIM_SRC, 'g');
            while ((mm = re.exec(w))) last = mm.index + mm[0].length;
            return last >= 0 ? w.slice(last) : w;
        }

        function parse(raw) {
            const r = {};
            // ชื่อเป้าหมาย เช่น "... เพื่อซื้อ uniqlo t-shirt"
            const lm = raw.match(/เพื่อ\s*(?:ซื้อ)?\s*/);
            if (lm) {
                const rest = raw.slice(lm.index + lm[0].length);
                const cut = rest.search(/(^|\s|,)(ภายใน|ใน\s*\d|ใน\s*(หนึ่ง|สอง|สาม)|เป็นเวลา|ไม่|เว้น|ยกเว้น|ทุก|ราย|วันละ|สัปดาห์ละ|อาทิตย์ละ|เดือนละ|เริ่ม|ตั้งแต่|เฉพาะ|แต่)/);
                const label = (cut >= 0 ? rest.slice(0, cut) : rest).trim().slice(0, 40);
                if (label) { r.label = label; raw = raw.slice(0, lm.index) + ' ' + (cut >= 0 ? rest.slice(cut) : ''); }
            }
            let t = normalize(raw);

            // วันเว้นวัน
            if (/วัน\s*เว้น\s*วัน/.test(t)) { r.everyOther = true; t = t.replace(/วัน\s*เว้น\s*วัน/g, ' '); }

            // ---- ตัวเลข: ยอดเงิน / ระยะเวลา / วันที่ / ยอดต่อครั้ง ----
            const NUM_RE = /(\d+(?:\.\d+)?)(\s*(k|พัน|หมื่น|แสน|ล้าน))?(\s*(บาท|฿|thb|b(?![a-z])))?/g;
            const MULT = { k: 1e3, 'พัน': 1e3, 'หมื่น': 1e4, 'แสน': 1e5, 'ล้าน': 1e6 };
            const timeCands = [], bare = [];
            let m;
            while ((m = NUM_RE.exec(t))) {
                const val = parseFloat(m[1]) * (m[3] ? MULT[m[3]] : 1);
                const before = t.slice(0, m.index), after = t.slice(m.index + m[0].length);
                const hasCur = !!m[5] || /฿\s*$/.test(before), hasMult = !!m[3];
                if (!hasCur && /^\s*(ครั้ง|หน|%|เปอร์)/.test(after)) continue;
                if (!hasCur && /(เริ่ม|ตั้งแต่)[^,\d]{0,8}วันที่\s*$/.test(before)) { r.start = { type: 'date', day: Math.min(31, Math.max(1, Math.round(val))) }; continue; }
                if (!hasCur && /วันที่\s*$/.test(before)) { r.monthDay = Math.min(31, Math.max(1, Math.round(val))); if (!r.frequency) r.frequency = 'monthly'; continue; }
                const per = before.match(/(วัน|สัปดาห[์]?|อาทิต[ย์]*|เดือน|ครั้ง)\s*ละ\s*$/);
                if (per) {
                    r.perAmount = val;
                    if (per[1] !== 'ครั้ง') r.frequency = per[1] === 'วัน' ? 'daily' : per[1] === 'เดือน' ? 'monthly' : 'weekly';
                    continue;
                }
                if (!hasCur && !hasMult) {
                    const u = after.match(/^\s*(วัน|สัปดาห|อาทิต|เดือน|ปี|days?|weeks?|months?|years?)/);
                    if (u) {
                        const unit = /^(วัน|day)/.test(u[1]) ? 'day' : /^(สัปดาห|อาทิต|week)/.test(u[1]) ? 'week' : /^(เดือน|month)/.test(u[1]) ? 'month' : 'year';
                        timeCands.push({ n: val, unit, pref: /(ภายใน|ใน|เป็นเวลา|ระยะเวลา|นาน|อีก)\s*$/.test(before) });
                        continue;
                    }
                    bare.push(val); continue;
                }
                if (r.amount == null) r.amount = val;
            }
            if (r.amount == null && bare.length) { r.amount = bare[0]; r.amountBare = true; }
            if (timeCands.length) {
                const c = timeCands.find(x => x.pref) || timeCands[0];
                r.duration = { n: c.n, unit: c.unit };
            } else if (/สิ้นปี|ปีนี้/.test(t)) r.endMode = 'year';
            else if (/สิ้นเดือน|เดือนนี้/.test(t)) r.endMode = 'month';
            else {
                const one = t.match(/(ภายใน|ใน|เป็นเวลา)\s*(สัปดาห|อาทิต|เดือน|ปี)(?![^\s]*ละ)/);
                if (one) r.duration = { n: 1, unit: /สัปดาห|อาทิต/.test(one[2]) ? 'week' : one[2] === 'เดือน' ? 'month' : 'year' };
            }

            // ---- ความถี่ ----
            if (!r.frequency) {
                if (/(ราย\s*เดือน|เดือน\s*ละ\s*(1\s*)?(ครั้ง|หน)|ทุก\s*ๆ?\s*เดือน|monthly|every month)/.test(t)) r.frequency = 'monthly';
                else if (/(ราย\s*(สัปดาห|อาทิต)|(สัปดาห|อาทิต)[ย์]*\s*ละ\s*(1\s*)?(ครั้ง|หน)|ทุก\s*ๆ?\s*(สัปดาห|อาทิต)|weekly|every week)/.test(t)) r.frequency = 'weekly';
                else if (new RegExp(`(ราย\\s*วัน|ทุก\\s*ๆ?\\s*วัน(?!\\s*(ที่|${DAY_NAMES}))|daily|every day)`).test(t)) r.frequency = 'daily';
            }

            // ---- วันที่ไม่ออม ----
            const excluded = new Set();
            const NEG = /ไม่ต้องออม|ไม่ออม|ไม่เก็บ|ไม่ฝาก|ไม่เอา|ไม่ต้อง|ยกเว้น|เว้น|งดออม|หยุดออม|งด|ข้าม|นอกจาก|except|skip|ไม่/g;
            while ((m = NEG.exec(t))) {
                const fw = fwd(t, m.index + m[0].length);
                let f = findDays(fw);
                const bwOk = /ไม่ต้องออม|ไม่ออม|ไม่เก็บ|ไม่ฝาก|งดออม|หยุดออม|^งด$/.test(m[0]) || (m[0] === 'ไม่ต้อง' && !fw.trim());
                if (!f.s.size && !f.today && bwOk) f = findDays(bwd(t, m.index));
                f.s.forEach(d => excluded.add(d));
                if (f.today) r.excludeToday = true;
            }

            // ---- ออมเฉพาะวัน ----
            const only = new Set();
            const ONLY_F = /เฉพาะ|แค่|only/g;
            while ((m = ONLY_F.exec(t))) findDays(fwd(t, m.index + m[0].length)).s.forEach(d => only.add(d));
            const ONLY_B = /เท่านั้น/g;
            while ((m = ONLY_B.exec(t))) findDays(bwd(t, m.index)).s.forEach(d => only.add(d));
            const EVERY = new RegExp(`(ทุก\\s*ๆ?\\s*|ออม\\s*)วัน(?=\\s*(${DAY_NAMES}))`, 'g');
            while ((m = EVERY.exec(t))) {
                const pre = t.slice(Math.max(0, m.index - 10), m.index);
                if (/ไม่|เว้น|งด|ข้าม|เริ่ม|ตั้งแต่/.test(pre)) continue;
                const end = m.index + m[0].length;
                if (/^[^,]{0,15}?(มากกว่า|เยอะ|น้อยกว่า|สองเท่า|2\s*เท่า)/.test(t.slice(end, end + 25))) continue;
                findDays(fwd(t, end)).s.forEach(d => only.add(d));
            }
            excluded.forEach(d => only.delete(d));
            if (excluded.size) r.excluded = [...excluded];
            if (only.size) r.only = [...only];

            // ---- น้ำหนัก (ออมวันไหนมากกว่า) ----
            const WEIGHT = new RegExp(`(วันหยุด|สุดสัปดาห์|เสาร์\\s*[-–]?\\s*(และ)?\\s*(วัน)?อาทิต[ย์]*|วันธรรมดา|วันทำงาน|วัน\\s*(${DAY_NAMES})[^\\s]*)\\s*(ออม|เก็บ|ให้|จะ)?\\s*(ได้)?\\s*(มากกว่า|เยอะกว่า|เยอะ|มาก|เพิ่ม|สองเท่า|2\\s*เท่า|น้อยกว่า|น้อย)`, 'g');
            const weights = {};
            while ((m = WEIGHT.exec(t))) {
                const factor = /น้อย/.test(m[7]) ? 0.5 : 2;
                findDays(m[1]).s.forEach(d => { weights[d] = factor; });
            }
            if (Object.keys(weights).length) r.weights = weights;

            // ---- รูปแบบการกระจายยอด ----
            // ตารางแบ่งยอดเท่าๆ กันเสมอ (ไม่สุ่ม)
            if (/เท่า\s*ๆ?\s*กัน|คงที่|ยอดเดียวกัน|equal/.test(t)) r.style = 'equal';

            // ---- วันเริ่ม ----
            if (!r.start) {
                if (/(เริ่ม|ตั้งแต่)[^,\d]{0,10}พรุ่งนี้/.test(t)) r.start = { type: 'tomorrow' };
                else if (/(เริ่ม|ตั้งแต่)[^,\d]{0,10}(สัปดาห์หน้า|อาทิตย์หน้า)/.test(t)) r.start = { type: 'nextweek' };
                else if (/(เริ่ม|ตั้งแต่)[^,\d]{0,10}เดือนหน้า/.test(t)) r.start = { type: 'nextmonth' };
                else {
                    const sw = t.match(new RegExp(`(เริ่ม|ตั้งแต่)\\s*(ออม)?\\s*(ต้น)?\\s*วัน\\s*(${DAY_NAMES})`));
                    if (sw) r.start = { type: 'weekday', day: dayNameToNum(sw[4]) };
                }
            }
            return r;
        }

        function hasInfo(p) {
            return ['amount', 'perAmount', 'duration', 'endMode', 'frequency', 'excluded', 'only', 'excludeToday', 'weights', 'style', 'start', 'monthDay', 'everyOther'].some(k => p[k] != null);
        }

        function mergeReq(base, p) {
            const r = { ...base };
            if (p.amount != null) { r.amount = p.amount; r.amountBare = p.amountBare; if (p.perAmount == null) delete r.perAmount; }
            if (p.perAmount != null) { r.perAmount = p.perAmount; if (p.amount == null) delete r.amount; }
            if (p.duration) { r.duration = p.duration; delete r.endMode; }
            if (p.endMode) { r.endMode = p.endMode; delete r.duration; }
            ['frequency', 'monthDay', 'style', 'start', 'everyOther', 'excludeToday', 'label'].forEach(k => { if (p[k] != null) r[k] = p[k]; });
            if (p.excluded) r.excluded = [...new Set([...(base.excluded || []), ...p.excluded])];
            if (p.only) r.only = p.only;
            if (r.only && r.excluded) r.only = r.only.filter(d => !r.excluded.includes(d));
            if (p.weights) r.weights = { ...(base.weights || {}), ...p.weights };
            return r;
        }

        function computeStart(s, today) {
            if (!s) return today;
            if (s.type === 'tomorrow') return addDays(today, 1);
            if (s.type === 'nextweek') return addDays(today, 7 - ((today.getDay() + 6) % 7));
            if (s.type === 'nextmonth') return new Date(today.getFullYear(), today.getMonth() + 1, 1);
            if (s.type === 'weekday') return addDays(today, (s.day - today.getDay() + 7) % 7);
            if (s.type === 'date') {
                let d = new Date(today.getFullYear(), today.getMonth(), s.day);
                if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, s.day);
                return d;
            }
            return today;
        }

        function mulberry32(a) {
            return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        }

        // ---- สร้างแผนการออม ----
        function buildPlan(req, seed, todayOverride) {
            const today = dOnly(todayOverride || new Date());
            const start = computeStart(req.start, today);
            let end, unbounded = false;
            if (req.duration) {
                const { n, unit } = req.duration;
                if (!(n > 0)) return { error: 'ระยะเวลาต้องมากกว่า 0 นะ ลองบอกใหม่อีกครั้ง เช่น "1 เดือน" หรือ "2 สัปดาห์"' };
                if (unit === 'day') end = addDays(start, Math.max(1, Math.round(n)) - 1);
                else if (unit === 'week') end = addDays(start, Math.max(1, Math.round(n * 7)) - 1);
                else if (unit === 'month') end = Number.isInteger(n) ? addDays(addMonths(start, n), -1) : addDays(start, Math.round(n * 30) - 1);
                else end = addDays(addMonths(start, Math.round(n * 12)), -1);
            } else if (req.endMode === 'month') end = new Date(start.getFullYear(), start.getMonth() + 1, 0);
            else if (req.endMode === 'year') end = new Date(start.getFullYear(), 11, 31);
            else if (req.perAmount && req.amount) { unbounded = true; end = addDays(start, 3650); }
            else return { error: 'ยังไม่รู้ระยะเวลาเลย' };

            if (!unbounded && (end - start) / 864e5 > 3660) return { error: 'ระยะเวลานานเกิน 10 ปีแล้ว 😅 ลองตั้งเป้าหมายให้สั้นลงหน่อย จะได้มีกำลังใจออมมากขึ้นนะ' };

            const total0 = req.amount;
            if (!req.perAmount && !(total0 > 0)) return { error: 'ยอดเงินต้องมากกว่า 0 บาทนะ' };
            if ((total0 || 0) > 10000000 || (req.perAmount || 0) > 10000000) return { error: 'ยอดเงินสูงเกินไปสำหรับตารางออมรายวัน ลองลดเป้าหมายลงหรือแบ่งเป็นหลายเป้าหมายดูนะ' };
            if (req.perAmount != null && !(req.perAmount > 0)) return { error: 'ยอดต่อครั้งต้องมากกว่า 0 บาทนะ' };

            // วันที่ผ่านเงื่อนไข
            const exc = new Set(req.excluded || []), only = new Set(req.only || []);
            let cand = [];
            for (let d = start; d <= end; d = addDays(d, 1)) {
                const wd = d.getDay();
                if (exc.has(wd)) continue;
                if (only.size && !only.has(wd)) continue;
                if (req.excludeToday && +d === +today) continue;
                if (req.everyOther && Math.round((d - start) / 864e5) % 2 === 1) continue;
                cand.push(d);
            }

            // ความถี่
            const freq = req.frequency || 'daily';
            if (freq === 'weekly') {
                const groups = new Map();
                cand.forEach(d => { const k = dkey(addDays(d, -((d.getDay() + 6) % 7))); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
                const pref = only.size === 1 ? [...only][0] : null;
                cand = [...groups.values()].map(g => g.find(d => d.getDay() === pref) || g[0]);
            } else if (freq === 'monthly') {
                const groups = new Map();
                cand.forEach(d => { const k = d.getFullYear() * 12 + d.getMonth(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
                const target = req.monthDay || start.getDate();
                cand = [];
                groups.forEach(g => {
                    const dim = new Date(g[0].getFullYear(), g[0].getMonth() + 1, 0).getDate();
                    const pick = g.find(d => d.getDate() >= Math.min(target, dim));
                    if (pick) cand.push(pick);
                });
            }

            let amounts;
            if (unbounded) {
                const count = Math.ceil(total0 / req.perAmount - 1e-9);
                if (cand.length < count) return { error: 'ด้วยยอดต่อครั้งนี้ต้องใช้เวลานานเกิน 10 ปี ลองเพิ่มยอดต่อครั้งดูนะ' };
                cand = cand.slice(0, count);
            }
            if (!cand.length) {
                return { error: 'อุ๊ย! ตามเงื่อนไขนี้ไม่เหลือวันให้ออมเลย 😅 ลองขยายระยะเวลา เลื่อนวันเริ่ม หรือลดวันที่ยกเว้นลงหน่อยนะ', noDays: true };
            }

            const n = cand.length;
            if (req.perAmount) {
                amounts = cand.map(() => req.perAmount);
                if (unbounded) amounts[n - 1] = round2(total0 - req.perAmount * (n - 1));
            } else {
                if (total0 < n * 0.01) return { error: `ยอด ${fmtMoney(total0)} บาท น้อยเกินไปสำหรับ ${n} ครั้ง ลองเพิ่มยอดหรือลดจำนวนวันดูนะ` };
                const hasWeights = req.weights && cand.some(d => req.weights[d.getDay()]);
                amounts = hasWeights ? weightedSplit(total0, cand.map(d => req.weights[d.getDay()] || 1)) : niceSplit(total0, n);
            }

            const items = cand.map((d, i) => ({ date: d, amount: amounts[i] }));
            const total = round2(amounts.reduce((a, b) => a + b, 0));
            const warnings = [];
            if (n === 1 && freq !== 'daily') warnings.push('ช่วงนี้มีรอบออมแค่ครั้งเดียว ถ้าอยากแบ่งเป็นหลายงวด ลองขยายเวลาดูนะ');
            return {
                req, seed, start, end: unbounded ? cand[n - 1] : end, items, total, freq, warnings,
                viewMonth: new Date(cand[0].getFullYear(), cand[0].getMonth(), 1)
            };
        }
        // ---- แบ่งยอดให้เท่าๆ กัน (ต่างกันแค่นิดหน่อย) ----
        // เช่น 250 บาท / 7 วัน -> 35,35,35,35,35,35,40
        function niceSplit(total, n) {
            if (n <= 1) return [round2(total)];
            if (!Number.isInteger(total) || total < n) {            // ยอดมีเศษสตางค์ หรือน้อยมาก -> แบ่งเป็นสตางค์
                const T = Math.round(total * 100), base = Math.floor(T / n), r = T - base * n;
                return Array.from({ length: n }, (_, i) => (base + (i >= n - r ? 1 : 0)) / 100);
            }
            if (total % n === 0) return Array(n).fill(total / n);
            const avg = total / n;
            for (const step of [10, 5, 1]) {                         // ลองเลขกลมๆ ก่อน เศษไปรวมวันสุดท้าย
                const base = Math.floor(avg / step) * step;
                if (base <= 0) continue;
                const last = total - base * (n - 1);
                const okDiff = step === 1 ? 5 : Math.max(step, base * 0.25);
                if (last >= base && last - base <= okDiff) return [...Array(n - 1).fill(base), last];
            }
            const base = Math.floor(avg), r = total - base * n;     // ไม่งั้นเพิ่มวันละ 1 บาทในวันท้ายๆ
            return Array.from({ length: n }, (_, i) => base + (i >= n - r ? 1 : 0));
        }
        // แบบมีน้ำหนัก (เช่น วันหยุดออมมากกว่า) -> วันประเภทเดียวกันได้ยอดเท่ากัน
        function weightedSplit(total, weights) {
            const W = weights.reduce((a, b) => a + b, 0), integer = Number.isInteger(total);
            const out = weights.map(w => integer ? Math.floor(total * w / W) : Math.floor(total * w / W * 100) / 100);
            out[out.length - 1] = round2(total - out.slice(0, -1).reduce((a, b) => a + b, 0));
            return out;
        }

        // ---- รายรับ / รายจ่าย / เติมเกม ----
        const PER_SRC = 'วัน|สัปดาห์|สัปดาห|อาทิตย์|อาทิตย|อาทิต|เดือน|ปี';
        const PERIOD_DAYS = { day: 1, week: 7, month: 30, year: 365 };
        const PERIOD_WORD = { day: 'วัน', week: 'สัปดาห์', month: 'เดือน', year: 'ปี' };
        const periodOf = w => !w ? null : /^วัน/.test(w) ? 'day' : /^(สัปดาห|อาทิต)/.test(w) ? 'week' : /^เดือน/.test(w) ? 'month' : 'year';
        const MULT_F = { k: 1e3, 'พัน': 1e3, 'หมื่น': 1e4, 'แสน': 1e5 };
        const INCOME_KEYS = [['เงินเดือน', 'month'], ['รายได้', 'month'], ['รายรับ', 'month'], ['ค่าจ้าง', 'month'], ['ค่าแรง', 'day'], ['ได้เงิน', 'month'], ['เงินค่าขนม', 'day'], ['ได้ค่าขนม', 'day'], ['ค่าขนม', 'day']];
        const EXPENSE_TYPES = [
            { cat: 'game', label: 'ค่าเติมเกม', key: 'ซื้อของในเกม|เติมเงินในเกม|เติมเงินเกม|เติมเกมส์|เติมเกม|ค่าเกม|เติม\\s*robux|เติมโรบัค|เติมrov|เกม', def: 'month' },
            { cat: 'food', label: 'ค่ากิน', key: 'กินข้าว|ค่าข้าว|ค่ากิน|ค่าอาหาร|กินอาหาร|ข้าว|กิน', def: 'day' },
            { cat: 'transport', label: 'ค่าเดินทาง', key: 'ค่ารถไฟฟ้า|ค่ารถเมล์|ค่ารถ|ค่าเดินทาง|ค่าน้ำมัน|ค่าวิน|ค่าbts|เดินทาง', def: 'day' },
            { cat: 'snack', label: 'ค่าขนม', key: 'ซื้อขนม|กินขนม|ขนม', def: 'day' },
            { cat: 'bills', label: 'ค่าที่พัก/ค่าบิล', key: 'ค่าหอ|ค่าห้อง|ค่าเช่า|ค่าน้ำค่าไฟ|ค่าไฟ|ค่าน้ำ|ค่าเน็ต|ค่าโทรศัพท์|ค่าโทร', def: 'month' },
            { cat: 'other', label: 'ค่าใช้จ่ายอื่น', key: 'ค่าใช้จ่ายอื่นๆ|ค่าใช้จ่ายอื่น|ค่าใช้จ่าย|ใช้จ่าย|ใช้เงิน', def: 'day' }
        ];
        const ITEM_GUESS = [[/ตั๋วหนัง|ดูหนัง/, 'ตั๋วหนัง', 250], [/ชาไข่มุก|ชานม/, 'ชานม', 60], [/กาแฟ/, 'กาแฟ', 65]];
        const NUM_F = '(\\d+(?:\\.\\d+)?)\\s*(k|พัน|หมื่น|แสน)?\\s*(?:บาท|฿)?';
        const NOT_COUNT = '(?!\\s*(?:ครั้ง|ใบ|ชิ้น|อัน|แก้ว|คู่|ตัว|เครื่อง|เล่ม|มื้อ|คน|วัน|สัปดาห|อาทิต|เดือน|ปี))';

        // ดึงข้อมูลการเงินออกจากข้อความ แล้วคืนข้อความที่เหลือไปให้ parse() ทำตาราง
        function parseFinance(raw, wishlist) {
            const TH = '๐๑๒๓๔๕๖๗๘๙';
            let t = raw.replace(/[๐-๙]/g, c => TH.indexOf(c)).replace(/(\d),(?=\d{3})/g, '$1').replace(/(\d),(?=\d{3})/g, '$1');
            const fin = { income: null, expenses: [], gameMentioned: false };
            const blank = (m) => { t = t.slice(0, m.index) + ' '.repeat(m[0].length) + t.slice(m.index + m[0].length); };
            const val = (num, mult) => parseFloat(num) * (mult ? MULT_F[mult.toLowerCase()] : 1);

            // รายรับ
            for (const [key, def] of INCOME_KEYS) {
                const re = new RegExp(`(${key})(?:ของ(?:ฉัน|ผม|เรา|หนู))?\\s*(?:คือ|ประมาณ|ราวๆ|ราว|=|:)?\\s*(?:(${PER_SRC})\\s*ละ\\s*)?(?:ประมาณ\\s*)?${NUM_F}\\s*(?:(?:ต่อ|\\/)\\s*(${PER_SRC}))?`, 'i');
                const m = t.match(re);
                if (m) { fin.income = { amount: val(m[3], m[4]), period: periodOf(m[2] || m[5]) || def, word: key }; blank(m); break; }
            }
            // รายจ่าย
            for (const ex of EXPENSE_TYPES) {
                const re = new RegExp(`(${ex.key})[^\\d\\n,]{0,12}?(?:(${PER_SRC})\\s*ละ\\s*)?(?:ประมาณ|ราวๆ|ราว)?\\s*${NUM_F}${NOT_COUNT}\\s*(?:(?:ต่อ|\\/|ทุก)\\s*(${PER_SRC}))?`, 'gi');
                let m;
                while ((m = re.exec(t))) {
                    const word = m[1], hasPeriod = !!(m[2] || m[5]);
                    // คำกว้างๆ (กิน/ข้าว/ขนม/เกม/ใช้เงิน) ต้องมีช่วงเวลา เช่น "วันละ" ไม่งั้นอาจเป็นของที่อยากซื้อ
                    if (!hasPeriod && /^(กิน|ข้าว|ขนม|เกม|เดินทาง|ใช้เงิน|ใช้จ่าย)$/.test(word)) continue;
                    const label = ex.cat === 'food' ? (/ข้าว/.test(word) ? 'ค่าข้าว' : 'ค่ากิน') : ex.cat === 'game' ? 'ค่าเติมเกม' : (/^ค่า/.test(word) ? word : ex.label);
                    fin.expenses.push({ cat: ex.cat, label, amount: val(m[3], m[4]), period: periodOf(m[2] || m[5]) || ex.def });
                    blank(m); re.lastIndex = 0;
                }
            }
            if (/เติมเกม|ซื้อของในเกม|ค่าเกม|เติมเงินเกม|เล่นเกม|robux|โรบัค/i.test(t)) fin.gameMentioned = true;

            // ของที่อยากได้ + จำนวน (เช่น ตั๋วหนัง 1 ใบ)
            let qty = 1, unitWord = '';
            const q = t.match(/(\d+)\s*(ใบ|ชิ้น|อัน|แก้ว|คู่|ตัว|เครื่อง|เล่ม)/);
            if (q) { qty = Math.max(1, parseInt(q[1], 10)); unitWord = q[2]; blank(q); }
            let item = null;
            const low = t.toLowerCase();
            const w = (wishlist || []).filter(x => x && x.name && low.includes(String(x.name).toLowerCase())).sort((a, b) => b.name.length - a.name.length)[0];
            if (w) item = { name: w.name, price: +w.price, qty, unitWord, source: 'wishlist' };
            else for (const [re, name, price] of ITEM_GUESS) if (re.test(t)) { item = { name, price, qty, unitWord, source: 'guess' }; break; }
            // ชื่อของที่อยากได้ (ใช้ตั้งชื่อแผน) เช่น "อยากได้หูฟัง 2990"
            let itemName = item ? item.name : null;
            if (!itemName) {
                const nm = t.match(/(?:อยากได้|อยากซื้อ|เก็บเงินซื้อ|ออมเงินซื้อ|ไว้ซื้อ|ซื้อ)\s*([^\d,]{2,30}?)\s*(?=\d|ภายใน|ใน\s|ราคา|$|,)/);
                if (nm && !/^(เงิน|ของ|อะไร|บ้าง)$/.test(nm[1].trim())) itemName = nm[1].trim();
            }
            return { fin, item, itemName, rest: t };
        }

        function mergeFinance(base, add) {
            const out = { income: (base && base.income) || null, expenses: [...((base && base.expenses) || [])] };
            if (add.income) out.income = add.income;
            add.expenses.forEach(e => { out.expenses = out.expenses.filter(x => x.cat !== e.cat); out.expenses.push(e); });
            return out;
        }

        // คำนวณเงินที่เหลือออมได้ต่อวัน แล้วเทียบกับยอดที่ต้องออม
        function budgetOf(fin) {
            if (!fin || !fin.income || !(fin.income.amount > 0)) return null;
            const inc = fin.income.amount / PERIOD_DAYS[fin.income.period];
            let fixed = 0, game = 0;
            (fin.expenses || []).forEach(e => { const d = e.amount / PERIOD_DAYS[e.period]; if (e.cat === 'game') game += d; else fixed += d; });
            return { inc, fixed, game, free: inc - fixed - game, freeBeforeGame: inc - fixed };
        }
        function assessPlan(plan, fin) {
            const b = budgetOf(fin); if (!b) return null;
            const days = Math.round((plan.end - plan.start) / 864e5) + 1;
            const need = plan.total / days;
            const res = { ...b, need, days, ok: need <= b.free + 1e-9 };
            if (!res.ok) {
                if (b.free > 0) res.daysNeeded = Math.ceil(plan.total / b.free);
                const g = (fin.expenses || []).find(e => e.cat === 'game');
                if (g && need <= b.freeBeforeGame) {
                    const per = PERIOD_DAYS[g.period];
                    res.cutGame = Math.min(g.amount, Math.ceil((need - b.free) * per / 10) * 10);
                    res.game0 = g;
                }
            }
            return res;
        }
        // ==LOGIC END== ------------------------------------------------------

        // ---------------------------------------------------------------------
        // ส่วนแสดงผลแชท
        const $chat = document.getElementById('chat');
        const $chips = document.getElementById('chips');
        const $form = document.getElementById('chatForm');
        const $input = document.getElementById('chatInput');
        const plans = {};
        let context = null;     // เงื่อนไขล่าสุด ใช้เติมข้อมูล / แก้ไขต่อ
        let awaiting = null;    // 'amount' | 'duration'
        let busy = false;

        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const scrollDown = () => requestAnimationFrame(() => $chat.scrollTo({ top: $chat.scrollHeight, behavior: 'smooth' }));
        const AVATAR = '<div class="w-8 h-8 bg-[#9c8a7e] rounded-full mt-1 shrink-0 flex items-center justify-center text-white text-xs"><i class="fa-solid fa-piggy-bank"></i></div>';

        let finance = null;     // รายรับ/รายจ่ายที่ผู้ใช้เคยบอก (จำไว้ใน Firebase)
        let gameMentioned = false;
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const baht = n => (Math.round(n * 100) / 100).toLocaleString('th-TH', { maximumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2 });

        const EXAMPLES = [
            'กรอกข้อมูลรายรับ-รายจ่าย',
            'เงินเดือน 10,000 กินข้าววันละ 40 มีเติมเกมด้วย อยากซื้อตั๋วหนัง 1 ใบใน 1 อาทิตย์',
            'ได้ค่าขนมวันละ 150 อยากเก็บ 2,000 ใน 1 เดือน',
            'อยากเก็บ 500 บาทใน 1 เดือน แต่ไม่เก็บวันอังคาร',
            'เก็บวันละ 20 จนครบ 1,000',
            'อยากเก็บ 3,000 ใน 3 เดือน แบบรายสัปดาห์'
        ];

        function setChips(list) {
            $chips.innerHTML = (list || []).map(c => `<button type="button" data-chip="${esc(c)}" class="shrink-0 bg-white/80 hover:bg-white text-[#7a6a5f] text-sm px-3 py-2 rounded-full border border-[#d9cfc7] shadow-sm whitespace-nowrap">${esc(c)}</button>`).join('');
        }

        function addUser(text) {
            const row = document.createElement('div');
            row.className = 'flex justify-end msg-in';
            row.innerHTML = `<div class="bg-[#a3948b] text-white p-4 rounded-3xl rounded-tr-none max-w-[80%] shadow-sm text-sm break-words">${esc(text)}</div>`;
            $chat.append(row); scrollDown();
        }

        function addBot(html, { wide = false, id = '' } = {}) {
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-start msg-in';
            row.innerHTML = `${AVATAR}<div ${id ? `id="${id}"` : ''} class="bg-[#fcefdc] text-gray-800 p-4 rounded-3xl rounded-tl-none ${wide ? 'w-[85%] max-w-sm' : 'max-w-[80%]'} shadow-sm text-sm space-y-3">${html}</div>`;
            $chat.append(row); scrollDown();
            return row;
        }

        function botReply(fn) {
            busy = true;
            const typing = document.createElement('div');
            typing.className = 'flex gap-2 items-start msg-in';
            typing.innerHTML = `${AVATAR}<div class="bg-[#fcefdc] px-4 py-3 rounded-3xl rounded-tl-none shadow-sm flex gap-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
            $chat.append(typing); scrollDown();
            setTimeout(() => { typing.remove(); fn(); busy = false; }, 700 + Math.random() * 700);
        }

        // ---- การ์ดตารางการออม ----
        const compact = n => n >= 1000 ? (Math.round(n / 100) / 10) + 'k' : (Number.isInteger(n) ? String(n) : n.toFixed(n < 10 ? 2 : 1));
        const FREQ_LABEL = { daily: 'รายวัน', weekly: 'รายสัปดาห์', monthly: 'รายเดือน' };
        const sameMonth = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();

        function badges(p) {
            const r = p.req, b = [];
            b.push(`<i class="fa-regular fa-clock"></i> ${fmtDate(p.start, { day: 'numeric', month: 'short' })} – ${fmtDate(p.end, { day: 'numeric', month: 'short', year: '2-digit' })}`);
            b.push(`<i class="fa-solid fa-repeat"></i> ${FREQ_LABEL[p.freq]}${p.freq === 'monthly' && r.monthDay ? ` (วันที่ ${r.monthDay})` : ''}`);
            if (r.everyOther) b.push('วันเว้นวัน');
            if (r.excluded && r.excluded.length) b.push(`<i class="fa-solid fa-ban"></i> ไม่ออมวัน${r.excluded.map(d => DAY_FULL[d]).join(', ')}`);
            if (r.only && r.only.length) b.push(`เฉพาะวัน${r.only.map(d => DAY_FULL[d]).join(', ')}`);
            if (r.excludeToday) b.push('ไม่ออมวันนี้');
            if (r.weights) Object.entries(r.weights).forEach(([d, f]) => b.push(`วัน${DAY_FULL[d]}ออม${f > 1 ? 'มากขึ้น' : 'น้อยลง'}`));
            if (r.perAmount) b.push(`ครั้งละ ${fmtMoney(r.perAmount)} ฿`);
            else if (!r.weights) b.push('ยอดเท่าๆ กัน');
            return b.map(x => `<span class="inline-flex items-center gap-1 bg-white/70 border border-[#e6d8c6] text-[11px] text-[#7a6a5f] px-2 py-0.5 rounded-full">${x}</span>`).join('');
        }

        function calendarHTML(p) {
            const vm = p.viewMonth, y = vm.getFullYear(), mo = vm.getMonth();
            const dim = new Date(y, mo + 1, 0).getDate(), lead = new Date(y, mo, 1).getDay();
            const map = {}; p.items.forEach(it => { map[dkey(it.date)] = it.amount; });
            const today = dOnly(new Date());
            const first = p.items[0].date, last = p.items[p.items.length - 1].date;
            const canPrev = !sameMonth(vm, first) && vm > first, canNext = !sameMonth(vm, last) && vm < last;
            let cells = '';
            for (let i = 0; i < lead; i++) cells += '<div></div>';
            for (let day = 1; day <= dim; day++) {
                const d = new Date(y, mo, day), amt = map[dkey(d)];
                const inRange = d >= p.start && d <= p.end;
                const isToday = +d === +today ? ' ring-2 ring-yellow-400' : '';
                const cls = amt != null ? 'bg-[#9c8a7e] text-white' : inRange ? 'text-gray-400 bg-gray-100' : 'text-gray-300';
                cells += `<div class="h-9 rounded-md flex flex-col items-center justify-center ${cls}${isToday}">
                    <span class="text-[11px] font-semibold leading-none">${day}</span>
                    ${amt != null ? `<span class="text-[8px] leading-none mt-0.5">${compact(amt)}</span>` : ''}
                </div>`;
            }
            return `<div class="bg-white border-2 border-black rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <button data-act="prev" data-id="${p.id}" class="w-7 h-7 rounded-full ${canPrev ? 'hover:bg-gray-100 text-black' : 'text-gray-200 cursor-default'}" ${canPrev ? '' : 'disabled'}><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <div class="flex items-center gap-2 font-semibold text-sm"><i class="fa-regular fa-calendar-days text-lg"></i>${fmtDate(vm, { month: 'long', year: 'numeric' })}</div>
                    <button data-act="next" data-id="${p.id}" class="w-7 h-7 rounded-full ${canNext ? 'hover:bg-gray-100 text-black' : 'text-gray-200 cursor-default'}" ${canNext ? '' : 'disabled'}><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-gray-500 mb-1">${DAY_SHORT.map(d => `<div>${d}</div>`).join('')}</div>
                <div class="grid grid-cols-7 gap-1 text-center">${cells}</div>
            </div>`;
        }

        function cardHTML(p) {
            const n = p.items.length, shown = p.expanded ? p.items : p.items.slice(0, 6);
            const rows = shown.map((it, i) => `<div class="flex justify-between ${i < shown.length - 1 ? 'border-b border-gray-200/80 pb-1' : ''}">
                    <span>${fmtDate(it.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span><span class="font-bold">${fmtMoney(it.amount)} ฿</span></div>`).join('');
            return `
                <div class="flex items-center gap-3">
                    ${p.image ? `<img src="${p.image}" alt="" class="w-12 h-12 rounded-xl object-cover shrink-0">` : ''}
                    <p class="font-semibold text-[#9c8a7e] flex-1">${esc(p.headline)}</p>
                </div>
                ${calendarHTML(p)}
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white/70 rounded-xl py-2"><div class="text-[10px] text-gray-500">เป้าหมาย</div><div class="font-bold text-sm">${fmtMoney(p.total)}฿</div></div>
                    <div class="bg-white/70 rounded-xl py-2"><div class="text-[10px] text-gray-500">จำนวนครั้ง</div><div class="font-bold text-sm">${n} ครั้ง</div></div>
                    <div class="bg-white/70 rounded-xl py-2"><div class="text-[10px] text-gray-500">เฉลี่ย/ครั้ง</div><div class="font-bold text-sm">${fmtMoney(p.total / n)}฿</div></div>
                </div>
                <div class="flex flex-wrap gap-1">${badges(p)}</div>
                ${p.warnings.map(w => `<div class="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-2 py-1.5"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${esc(w)}</div>`).join('')}
                <div class="space-y-2 text-sm bg-white/50 p-2 rounded-xl">
                    ${rows}
                    ${n > 6 ? `<button data-act="toggle" data-id="${p.id}" class="w-full text-center text-xs text-[#9c8a7e] font-semibold pt-1">${p.expanded ? 'ย่อรายการ <i class="fa-solid fa-chevron-up"></i>' : `ดูทั้งหมด (${n} รายการ) <i class="fa-solid fa-chevron-down"></i>`}</button>` : ''}
                    <div class="flex justify-between border-t-2 border-dashed border-gray-300 pt-1 font-semibold text-[#7a6a5f]"><span>รวม</span><span>${fmtMoney(p.total)} ฿</span></div>
                </div>
                <div class="flex gap-2">
                    ${p.saved
                        ? `<a href="dashboard.html" class="flex-1 text-center bg-green-600 text-white rounded-full py-2 text-xs font-semibold"><i class="fa-solid fa-check mr-1"></i>บันทึกแล้ว · ไปหน้าติดตาม</a>`
                        : `<button data-act="save" data-id="${p.id}" class="flex-1 bg-[#9c8a7e] hover:bg-[#8a7a6f] text-white rounded-full py-2 text-xs font-semibold"><i class="fa-solid fa-floppy-disk mr-1"></i>เอาตารางนี้</button>
                           <button data-act="img" data-id="${p.id}" class="bg-white border border-[#9c8a7e] text-[#9c8a7e] rounded-full px-3 py-2 text-xs font-semibold"><i class="fa-solid fa-camera mr-1"></i>${p.image ? 'เปลี่ยนรูป' : 'ใส่รูปสินค้า'}</button>`}
                </div>`;
        }

        function renderCard(p) { const el = document.getElementById(`card-${p.id}`); if (el) el.innerHTML = cardHTML(p); }

        // บันทึกแผนลง Firestore (users/{uid}/goals/{id})
        async function savePlan(p) {
            const title = p.req.label ? `${p.req.label}` : `ออมเงิน ${baht(p.total)} บาท`;
            // ผูกกับ "เป้าหมายของคุณ": ถ้ามีเป้าหมายชื่อเดียวกันอยู่แล้วใช้อันนั้น ไม่งั้นสร้างใหม่
            const norm = x => String(x || '').trim().toLowerCase();
            let wish = AOMSUK.wishlist.find(w => norm(w.name) === norm(title));
            if (!wish) {
                wish = { id: AOMSUK.newId(), name: title, price: p.total, emoji: guessEmoji(title), createdAt: new Date().toISOString() };
                if (p.image) wish.image = p.image;
                await AOMSUK.saveWish(wish);
            } else if (p.image && p.image !== wish.image) {
                await AOMSUK.saveWish({ ...wish, image: p.image });
            }
            const goal = {
                id: p.id,
                wishId: wish.id,
                title,
                target: p.total,
                frequency: p.freq,
                startDate: dkey(p.start),
                endDate: dkey(p.end),
                conditions: { excludedDays: p.req.excluded || [], onlyDays: p.req.only || [], weights: p.req.weights || {}, style: p.req.perAmount ? 'fixed' : 'equal' },
                schedule: p.items.map(it => ({ date: dkey(it.date), amount: it.amount, saved: false })),
                savedAmount: 0,
                createdAt: new Date().toISOString()
            };
            await AOMSUK.saveGoal(goal);
            AOMSUK.notify(`plan_${goal.id}`, {
                type: 'plan', title: 'สร้างแผนการออมแล้ว',
                body: `"${goal.title}" ออม ${fmtMoney(goal.target)} ฿ ทั้งหมด ${goal.schedule.length} ครั้ง เริ่ม ${fmtDate(p.start, { day: 'numeric', month: 'short' })}`,
                link: 'dashboard.html'
            }).catch(() => { });
        }

        // ไอคอนของเป้าหมายจากชื่อ (ใช้ตอนสร้างเป้าหมายจากแชท)
        function guessEmoji(name) {
            const M = [[/ตั๋ว|หนัง|คอนเสิร์ต|ticket/i, '🎟️'], [/หูฟัง|airpods|headphone/i, '🎧'], [/เสื้อ|กางเกง|ชุด|shirt|uniqlo/i, '👕'], [/รองเท้า|nike|adidas/i, '👟'],
                [/กระเป๋า|bag/i, '👜'], [/ชา|กาแฟ|coffee|tea/i, '🧋'], [/มือถือ|โทรศัพท์|iphone|phone/i, '📱'], [/คอม|notebook|laptop|ipad|แท็บเล็ต/i, '💻'],
                [/เกม|game|switch|ps5/i, '🎮'], [/เที่ยว|ญี่ปุ่น|เกาหลี|trip|travel/i, '✈️'], [/ทะเล/i, '🏖️'], [/หนังสือ|book/i, '📚'], [/ของขวัญ|วันเกิด|gift/i, '🎁'],
                [/นาฬิกา|watch/i, '⌚'], [/กล้อง|camera/i, '📷'], [/ชาบู|หมูกระทะ|ซูชิ|บุฟเฟ่ต์|อาหาร/i, '🍣']];
            return (M.find(([re]) => re.test(name)) || [, '🎯'])[1];
        }

        // ---- สมองของบอท ----
        const HELP_HTML = `<p>เล่าให้ฟังแบบคุยกันปกติได้เลย ไม่ต้องเป๊ะ เช่น</p>
            <p class="bg-white/60 rounded-xl px-3 py-2 text-[13px]">"เงินเดือน 12,000 กินข้าววันละ 60 ค่ารถวันละ 30 เติมเกมเดือนละ 300 อยากได้หูฟัง 1,500 ภายใน 1 เดือน"</p>
            <p>เราจะดูให้ว่าหักค่าใช้จ่ายแล้วเหลือวันละเท่าไหร่ ต้องเก็บวันละเท่าไหร่ถึงจะทัน แล้วจัดตารางยอดเท่าๆ กันให้</p>
            <p class="text-[13px] text-gray-600">อยากเก็บแบบรายสัปดาห์ รายเดือน เว้นบางวัน หรือเริ่มพรุ่งนี้ ก็บอกได้ พอได้ตารางแล้วจะพิมพ์แก้ต่อ เช่น "เปลี่ยนเป็น 2 อาทิตย์" ก็ได้ พิมพ์ "เริ่มใหม่" ถ้าอยากเริ่มคิดใหม่</p>`;

        const FREQ_UNIT = { daily: ['วันละ', 'วัน'], weekly: ['สัปดาห์ละ', 'ครั้ง'], monthly: ['เดือนละ', 'ครั้ง'] };
        // อธิบายยอดในตารางแบบที่คนพูดกัน
        function describeAmounts(plan) {
            const a = plan.items.map(i => i.amount), n = a.length, [per, cnt] = FREQ_UNIT[plan.freq] || FREQ_UNIT.daily;
            if (n === 1) return `เก็บครั้งเดียว ${baht(a[0])} บาท`;
            const first = a[0];
            if (a.every(x => x === first)) return `${per} ${baht(first)} บาท ทั้งหมด ${n} ${cnt}`;
            if (a.slice(0, -1).every(x => x === first)) return `${per} ${baht(first)} บาท แล้ว${cnt === 'วัน' ? 'วัน' : 'ครั้ง'}สุดท้ายเก็บ ${baht(a[n - 1])} บาท (รวม ${n} ${cnt})`;
            const lo = Math.min(...a), hi = Math.max(...a);
            return `${per} ${baht(lo)}–${baht(hi)} บาท ทั้งหมด ${n} ${cnt}`;
        }

        function financeLine(fin, b) {
            const inc = fin.income, parts = [];
            if (inc.period === 'day') parts.push(`ได้วันละ ${baht(inc.amount)} บาท`);
            else if (inc.word === 'เงินเดือน' && inc.period === 'month') parts.push(`เงินเดือน ${baht(inc.amount)} บาท เฉลี่ยแล้วตกวันละประมาณ ${baht(Math.round(b.inc))} บาท`);
            else parts.push(`ได้${PERIOD_WORD[inc.period]}ละ ${baht(inc.amount)} บาท เฉลี่ยแล้วตกวันละประมาณ ${baht(Math.round(b.inc))} บาท`);
            const exps = (fin.expenses || []).map(e => e.period === 'day'
                ? `${e.label}วันละ ${baht(e.amount)}`
                : `${e.label}${PERIOD_WORD[e.period]}ละ ${baht(e.amount)} (ตกวันละ ~${baht(Math.round(e.amount / PERIOD_DAYS[e.period]))})`);
            if (exps.length) parts.push(`หัก${exps.join(' ')}`);
            if (b.free < 0.5) return parts.join(' ') + (b.free < -0.5 ? ` ก็จะติดลบวันละราว ${baht(Math.round(-b.free))} บาท` : ' ก็แทบไม่เหลือเลย');
            return parts.join(' ') + ` ก็จะเหลือวันละราว ${baht(Math.round(b.free))} บาท`;
        }

        function respond(text) {
            const t = normalize(text).trim();
            const noNum = !/\d/.test(t);

            if (/^(เริ่มใหม่|ล้าง|รีเซ็ต|reset|clear)/.test(t)) {
                context = null; awaiting = null;
                addBot(pick(['โอเค เริ่มใหม่กัน รอบนี้อยากเก็บเงินไว้ทำอะไรดี?', 'ล้างแล้ว อยากเก็บเงินไว้ซื้ออะไรดี เล่ามาได้เลย']));
                return setChips(EXAMPLES);
            }
            if (/(ลืม|ลบ|ล้าง)(ข้อมูล)?(รายได้|เงินเดือน|รายรับ)/.test(t)) {
                finance = null; AOMSUK.saveFinance(null).catch(() => { });
                addBot('ลบข้อมูลรายได้กับค่าใช้จ่ายที่เคยบอกไว้แล้วนะ ถ้าจะกรอกใหม่ ใช้ฟอร์มนี้ได้เลย');
                showFinanceForm();
                return setChips(EXAMPLES);
            }
            if (noNum && /(กรอกข้อมูล|แก้(ไข)?ข้อมูล|ฟอร์ม|รายรับ.?รายจ่าย)/.test(t)) {
                addBot('แก้ตัวเลขในฟอร์มได้เลย กด "คำนวณให้หน่อย" เมื่อเสร็จ');
                showFinanceForm();
                return setChips(EXAMPLES);
            }
            if (noNum && /^(help|ช่วย|วิธีใช้|ใช้ยังไง|ทำอะไรได้|สั่งอะไรได้)/.test(t)) { addBot(HELP_HTML); return setChips(EXAMPLES); }
            if (noNum && /(เป้าหมายของฉัน|ดูเป้าหมาย|เป้าหมายที่บันทึก|แผนของฉัน)/.test(t)) {
                const goals = AOMSUK.goals;
                addBot(goals.length
                    ? `ตอนนี้มีแผนเก็บเงินอยู่ ${goals.length} อัน:<br>${goals.slice(-5).map(g => `• ${esc(g.title)} (${esc(g.startDate)} ถึง ${esc(g.endDate)})`).join('<br>')}<br><a href="dashboard.html" class="text-[#9c8a7e] font-semibold underline">ไปดูที่หน้าติดตาม</a>`
                    : 'ยังไม่มีแผนเลย มาเริ่มอันแรกกัน อยากเก็บเงินไว้ซื้ออะไรดี?');
                return setChips(EXAMPLES);
            }

            // ดึงรายรับ/รายจ่าย/ของที่อยากได้ออกจากข้อความก่อน
            const F = parseFinance(text, AOMSUK.wishlist);
            const finChanged = !!(F.fin.income || F.fin.expenses.length);
            if (finChanged) { finance = mergeFinance(finance, F.fin); AOMSUK.saveFinance(finance).catch(() => { }); }
            if (F.fin.gameMentioned) gameMentioned = true;
            const force = !!context && /ทำตาราง(ตามนี้|เลย|ไปเลย)|เอาตามนี้|ไม่เป็นไร(เอา)?ตามเดิม|ตามเดิมเลย/.test(t);

            const p = parse(F.rest);
            if (!p.label && F.itemName && (p.amount != null || p.perAmount != null || F.item)) p.label = F.itemName;
            let itemNote = '';
            if (F.item && p.amount == null && p.perAmount == null) {
                p.amount = F.item.price * F.item.qty;
                p.label = p.label || `${F.item.name}${F.item.qty > 1 ? ` ${F.item.qty} ${F.item.unitWord}` : ''}`;
                if (F.item.source === 'guess') itemNote = `(คิด${F.item.name}ไว้ที่${F.item.unitWord || 'ราคา'}ละประมาณ ${baht(F.item.price)} บาทนะ ถ้าราคาไม่ใช่ก็บอกได้)`;
                else itemNote = `(ใช้ราคา${F.item.name}จากเป้าหมายที่ตั้งไว้ ${baht(F.item.price)} บาท)`;
            }

            if (!hasInfo(p) && !finChanged && !force) {
                if (/^(สวัสดี|หวัดดี|ดีจ้า|ดีครับ|ดีค่ะ|hello|hi|hey)/.test(t)) { addBot(pick([`สวัสดี คุณ ${esc(AOMSUK.displayName())} วันนี้อยากเก็บเงินไว้ทำอะไรเหรอ?`, `สวัสดี คุณ ${esc(AOMSUK.displayName())} มีอะไรอยากได้รึเปล่า เล่ามาได้เลย`])); return setChips(EXAMPLES); }
                if (/ขอบคุณ|ขอบใจ|thank|thx/.test(t)) { addBot(pick(['ยินดีเลย เก็บทีละนิดเดี๋ยวก็ถึง สู้ ๆ นะ', 'ไม่เป็นไรเลย มีอะไรให้ช่วยคิดอีกก็ทักมาได้นะ'])); return; }
                addBot('อันนี้เรายังไม่ค่อยเข้าใจ ลองเล่าแบบนี้ดูไหม <b>"เงินเดือน 10,000 กินข้าววันละ 40 อยากได้ตั๋วหนังใน 1 อาทิตย์"</b> หรือพิมพ์ <b>"ช่วย"</b> ก็ได้');
                return setChips(EXAMPLES);
            }

            // บอกแค่รายได้/รายจ่าย ยังไม่ได้บอกว่าจะเก็บเงินไปทำอะไร
            if (!hasInfo(p) && finChanged && !context) {
                const b = budgetOf(finance);
                if (b) addBot(`${financeLine(finance, b)}${b.free <= 0 ? ' ตอนนี้รายจ่ายเกือบเท่ารายได้แล้วนะ ลองดูว่ามีอะไรลดได้บ้าง' : ''}<br>จดไว้ให้แล้ว อยากเก็บเงินไว้ซื้ออะไร แล้วอยากได้ภายในกี่วันดี?`);
                else addBot('จดค่าใช้จ่ายไว้ให้แล้ว ถ้าบอกเงินเดือนหรือค่าขนมที่ได้ต่อวันด้วย เราจะช่วยดูให้ว่าเก็บได้วันละเท่าไหร่');
                return setChips(['อยากได้ตั๋วหนังใน 1 อาทิตย์', 'อยากเก็บ 1,000 ใน 1 เดือน', 'อยากเก็บ 5,000 ใน 3 เดือน']);
            }

            // ตอบตัวเลขลอยๆ ตอนถามระยะเวลา
            if (awaiting === 'duration' && p.amountBare && !p.duration && !p.endMode && Object.keys(p).length <= 2) {
                const n = p.amount;
                addBot(`${n} อะไรดี วัน อาทิตย์ หรือเดือน?`);
                return setChips([`${n} วัน`, `${n} อาทิตย์`, `${n} เดือน`]);
            }

            const complete = (p.amount != null || p.perAmount != null) && (p.duration || p.endMode || (p.perAmount && p.amount));
            let req = force ? context : (complete || !context) ? p : mergeReq(context, p);
            context = req;

            if (req.amount == null && req.perAmount == null) {
                awaiting = 'amount';
                addBot(pick(['อยากเก็บทั้งหมดเท่าไหร่ดี? หรือบอกชื่อของที่อยากได้มาก็ได้นะ', 'ของที่อยากได้ราคาเท่าไหร่เหรอ?']));
                return setChips(['500 บาท', '1,000 บาท', '5,000 บาท', 'วันละ 20 บาท']);
            }
            if (!req.duration && !req.endMode && !(req.perAmount && req.amount)) {
                awaiting = 'duration';
                addBot(req.perAmount
                    ? `เก็บครั้งละ ${baht(req.perAmount)} บาท อยากเก็บนานแค่ไหนดี? หรือบอกยอดรวมที่อยากได้ก็ได้ เช่น "จนครบ 1,000"`
                    : `${req.label ? `อยากได้${esc(req.label)}` : `เก็บ ${baht(req.amount)} บาท`} ภายในกี่วันดี?${itemNote ? ' ' + itemNote : ''}`);
                return setChips(['1 อาทิตย์', '2 อาทิตย์', '1 เดือน', '3 เดือน']);
            }
            awaiting = null;

            const plan = buildPlan(req, 1);
            if (plan.error) {
                addBot(esc(plan.error));
                return setChips(plan.noDays ? ['เริ่มพรุ่งนี้', 'ขยายเป็น 1 อาทิตย์', 'เริ่มใหม่'] : ['เริ่มใหม่', 'ช่วย']);
            }

            // เช็กกับรายรับ-รายจ่ายจริง
            const as = assessPlan(plan, finance);
            const what = req.label ? esc(req.label) : `เงิน ${baht(plan.total)} บาท`;
            const goalPhrase = req.label ? `อยากได้${esc(req.label)}` : `อยากเก็บ ${baht(plan.total)} บาท`;
            const days = Math.round((plan.end - plan.start) / 864e5) + 1;
            if (as && !as.ok && !force) {
                let msg = `${financeLine(finance, as)}<br><br>แต่ถ้า${goalPhrase}ภายใน ${days} วัน ต้องเก็บเฉลี่ยวันละประมาณ ${baht(Math.ceil(as.need))} บาท ${as.free > 0 ? 'ซึ่งเกินที่เหลืออยู่ไปหน่อย' : 'ตอนนี้ยังไม่พอ'}`;
                const chips = [];
                if (as.cutGame) {
                    const g = as.game0, left = Math.max(0, g.amount - as.cutGame);
                    msg += `<br><br>ถ้าช่วงนี้ลดเติมเกมลงสัก ${baht(as.cutGame)} บาท (จาก${PERIOD_WORD[g.period]}ละ ${baht(g.amount)} เหลือ ${baht(left)}) ก็จะพอเก็บทัน`;
                    chips.push(`ลดเติมเกมเหลือ${PERIOD_WORD[g.period]}ละ ${left}`);
                }
                if (as.daysNeeded) {
                    msg += `<br>${as.cutGame ? 'หรือ' : ''}ถ้าไม่อยากลดอะไร ขยายเวลาเป็นประมาณ ${as.daysNeeded} วันก็จะสบายขึ้นเยอะ`;
                    chips.push(`ขยายเป็น ${as.daysNeeded} วัน`);
                }
                if (as.free <= 0) msg += '<br>ตอนนี้รายจ่ายเท่ากับหรือมากกว่ารายได้แล้ว ลองดูว่ามีค่าอะไรที่พอลดได้บ้างก่อนนะ';
                addBot(msg + (itemNote ? `<br><span class="text-gray-500 text-[12px]">${itemNote}</span>` : ''));
                return setChips([...chips, 'ทำตารางตามนี้เลย', 'เริ่มใหม่']);
            }

            let intro;
            if (as) {
                const spare = as.free - as.need;
                intro = `${financeLine(finance, as)} ${goalPhrase}ใน ${days} วัน ก็เก็บ${describeAmounts(plan)}`;
                if (as.need > as.free * 0.8) intro += ' ค่อนข้างตึงอยู่นะ วันไหนใช้เยอะก็ลองประหยัดเพิ่มนิดนึง';
                else if (gameMentioned && as.game === 0) intro += ` ยังเหลือไว้เติมเกมได้สบาย ๆ (เหลือใช้อีกวันละราว ${baht(Math.round(spare))} บาท)`;
                else intro += ` แล้วยังเหลือใช้อีกวันละราว ${baht(Math.round(spare))} บาท สบาย ๆ`;
            } else {
                intro = `${req.label ? `${what} ` : `${baht(plan.total)} บาท `}ใน ${days} วัน เก็บ${describeAmounts(plan)}ก็ถึงแล้ว`;
                if (req.excluded && req.excluded.length) intro += ` (เว้นวัน${req.excluded.map(d => DAY_FULL[d]).join(', ')}ให้แล้ว)`;
                if (!finance) intro += '<br><span class="text-gray-500 text-[12px]">ถ้าอยากให้ช่วยดูว่าไหวไหม บอกเงินเดือนกับค่าใช้จ่ายต่อวันมาได้นะ</span>';
            }
            if (itemNote) intro += `<br><span class="text-gray-500 text-[12px]">${itemNote}</span>`;
            addBot(intro);

            plan.id = 'p' + Date.now().toString(36);
            plan.headline = `ตารางออม${req.label ? ' · ' + req.label : ''}`;
            if (req.label) {
                const w0 = AOMSUK.wishlist.find(w => normName(w.name) === normName(req.label));
                if (pendingImage && normName(pendingItem) === normName(req.label)) plan.image = pendingImage;
                else if (w0 && w0.image) plan.image = w0.image;
            }
            plans[plan.id] = plan;
            addBot(cardHTML(plan), { wide: true, id: `card-${plan.id}` });
            setChips(['แก้ข้อมูลรายรับ-รายจ่าย', 'เปลี่ยนเป็นรายสัปดาห์', 'ขยายเป็น 2 อาทิตย์', 'ไม่เก็บวันหยุด', 'เริ่มพรุ่งนี้', 'เริ่มใหม่']);
        }

        function send(text) {
            text = (text || '').trim();
            if (!text || busy) return;
            addUser(text);
            $input.value = '';
            botReply(() => respond(text));
        }

        $form.addEventListener('submit', e => { e.preventDefault(); send($input.value); });
        $chips.addEventListener('click', e => { const b = e.target.closest('[data-chip]'); if (b) send(b.dataset.chip); });
        $chat.addEventListener('click', e => {
            const b = e.target.closest('[data-act]'); if (!b) return;
            const p = plans[b.dataset.id]; if (!p) return;
            const act = b.dataset.act;
            if (act === 'prev') p.viewMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() - 1, 1);
            if (act === 'next') p.viewMonth = new Date(p.viewMonth.getFullYear(), p.viewMonth.getMonth() + 1, 1);
            if (act === 'toggle') p.expanded = !p.expanded;
            if (act === 'img') { imgTarget = { kind: 'plan', id: p.id }; $img.click(); return; }
            if (act === 'save') {
                if (p.saving || p.saved) return;
                p.saving = true;
                b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>กำลังบันทึก...';
                savePlan(p).then(() => {
                    p.saving = false; p.saved = true; renderCard(p);
                    botReply(() => addBot(pick([
                        'บันทึกให้แล้ว หยอดกระปุกเมื่อไหร่ก็ไปติ๊กที่หน้า <a href="dashboard.html" class="font-semibold text-[#9c8a7e] underline">ติดตาม</a> นะ',
                        'เรียบร้อย เก็บไว้ในหน้า <a href="dashboard.html" class="font-semibold text-[#9c8a7e] underline">ติดตาม</a> แล้ว วันนี้เริ่มวันแรกเลยไหม?'
                    ])));
                }, err => {
                    p.saving = false; renderCard(p);
                    addBot(`บันทึกไม่ได้ ${esc(err.message)} ลองกดอีกทีนะ`);
                });
                return;
            }
            renderCard(p);
        });

        // ---------------- ฟอร์มกรอกรายรับ-รายจ่าย-เป้าหมาย ----------------
        // ข้อมูลในฟอร์มจะ "แทนที่" ของเดิมทั้งหมด (แก้ปัญหาบอทจำข้อมูลเก่า)
        let formSeq = 0;
        const formImages = {};          // รูปสินค้าที่เลือกในฟอร์ม (ตาม id ฟอร์ม)
        let pendingImage = null, pendingItem = '';
        const normName = x => String(x || '').trim().toLowerCase();
        function financeFormHTML(pre = {}) {
            const f = finance || {}, ex = f.expenses || [];
            const get = cat => ex.find(e => e.cat === cat);
            const food = get('food'), travel = get('transport');
            const others = ex.filter(e => !['food', 'transport', 'game'].includes(e.cat));
            const other = others.length === 1 ? others[0] : (others.length ? { amount: others.reduce((a, e) => a + e.amount / PERIOD_DAYS[e.period], 0), period: 'day' } : null);
            const inc = f.income;
            const v = x => x != null && x !== '' ? String(Math.round(x * 100) / 100) : '';
            const PERS = [['day', 'ต่อวัน'], ['week', 'ต่อสัปดาห์'], ['month', 'ต่อเดือน']];
            const sel = (name, opts, cur) => `<select name="${name}" class="rounded-xl bg-white border border-[#e6d8c6] px-2 py-2 text-base">${opts.map(([val, lab]) => `<option value="${val}" ${val === cur ? 'selected' : ''}>${lab}</option>`).join('')}</select>`;
            const num = (name, val, ph) => `<input name="${name}" type="number" inputmode="decimal" min="0" step="any" value="${v(val)}" placeholder="${ph}" class="flex-1 min-w-0 rounded-xl bg-white border border-[#e6d8c6] px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-[#9c8a7e]">`;
            const row = (label, inner, hint) => `<label class="block"><span class="block text-sm font-semibold text-gray-700 mb-1">${label}${hint ? ` <span class="font-normal text-gray-500 text-xs">${hint}</span>` : ''}</span><div class="flex gap-2 items-center">${inner}</div></label>`;
            const id = 'ff' + (++formSeq);
            if (pre.image) formImages[id] = pre.image;
            return `<form data-finform id="${id}" class="space-y-3" novalidate>
                <p class="font-semibold text-[#9c8a7e]">${pre.title || 'กรอกข้อมูลคร่าว ๆ ให้หน่อยนะ เดี๋ยวช่วยคิดว่าเก็บวันละเท่าไหร่ถึงไหว'}</p>
                ${row('รายได้', num('inc', inc && inc.amount, 'เช่น 10000') + sel('incPer', [['month', 'ต่อเดือน'], ['week', 'ต่อสัปดาห์'], ['day', 'ต่อวัน']], (inc && inc.period) || 'month'))}
                ${row('ค่ากิน', num('food', food && food.amount, 'เช่น 40') + sel('foodPer', PERS, (food && food.period) || 'day'))}
                ${row('ค่าเดินทาง', num('travel', travel && travel.amount, 'ไม่มีเว้นว่าง') + sel('travelPer', PERS, (travel && travel.period) || 'day'))}
                ${row('ค่าใช้จ่ายอื่น ๆ', num('other', other && other.amount, 'ไม่มีเว้นว่าง') + sel('otherPer', PERS, (other && other.period) || 'day'))}
                <div class="border-t-2 border-dashed border-[#e6d8c6] pt-3 space-y-3">
                    <p class="text-sm font-bold text-gray-700">อยากออมเงิน <span class="font-normal text-gray-500 text-xs">(ถ้ายังไม่รู้ เว้นว่างได้)</span></p>
                    <div>
                        <span class="block text-sm font-semibold text-gray-700 mb-1">อยากได้อะไร</span>
                        <div class="flex gap-2 items-center">
                            <button type="button" data-pickimg="${id}" class="w-12 h-12 shrink-0 rounded-xl bg-white border-2 border-dashed border-[#d9cfc7] text-gray-400 flex flex-col items-center justify-center overflow-hidden" aria-label="เพิ่มรูปสินค้า">${pre.image ? `<img src="${pre.image}" alt="" class="w-full h-full object-cover">` : '<i class="fa-solid fa-camera"></i><span class="text-[10px] leading-none mt-0.5">รูป</span>'}</button>
                            <input name="item" type="text" maxlength="40" value="${esc(pre.item || '')}" placeholder="เช่น ตั๋วหนัง" class="flex-1 min-w-0 rounded-xl bg-white border border-[#e6d8c6] px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-[#9c8a7e]">
                        </div>
                        <span class="block text-xs text-gray-500 mt-1">แตะกล่องรูปกล้องเพื่อใส่รูปสินค้าจากเครื่องหรือมือถือ</span>
                    </div>
                    ${row('ต้องการออม', num('target', pre.target, 'เช่น 250') + '<span class="text-sm text-gray-600 shrink-0">บาท</span>')}
                    ${row('ภายใน', num('durN', '', 'เช่น 7') + sel('durU', [['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน']], 'day'))}
                </div>
                <p data-err class="hidden text-sm text-red-500"></p>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-[#9c8a7e] text-white font-semibold rounded-full py-2.5 text-base">คำนวณให้หน่อย</button>
                    <button type="button" data-clearfin class="bg-white border border-[#9c8a7e] text-[#9c8a7e] font-semibold rounded-full px-4 py-2.5 text-sm">ล้างข้อมูล</button>
                </div>
            </form>`;
        }
        function showFinanceForm(pre) { addBot(financeFormHTML(pre), { wide: true }); }

        // ---- เลือกรูปสินค้า (จากฟอร์ม หรือจากการ์ดตาราง) ----
        const $img = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', className: 'hidden' });
        document.body.appendChild($img);
        let imgTarget = null;
        $chat.addEventListener('click', e => {
            const pb = e.target.closest('[data-pickimg]');
            if (pb) { imgTarget = { kind: 'form', id: pb.dataset.pickimg }; $img.click(); }
        });
        $img.addEventListener('change', async () => {
            const file = $img.files[0]; $img.value = '';
            if (!file || !imgTarget) return;
            const t = imgTarget; imgTarget = null;
            try {
                const data = await AOMSUK.resizeImage(file, 480);
                if (t.kind === 'form') {
                    formImages[t.id] = data;
                    const btn = $chat.querySelector(`[data-pickimg="${t.id}"]`);
                    if (btn) btn.innerHTML = `<img src="${data}" alt="" class="w-full h-full object-cover">`;
                } else if (plans[t.id]) { plans[t.id].image = data; renderCard(plans[t.id]); }
            } catch (err) { addBot(esc(err.message)); }
        });

        $chat.addEventListener('click', e => {
            const c = e.target.closest('[data-clearfin]'); if (!c) return;
            const form = c.closest('form');
            form.querySelectorAll('input').forEach(i => { i.value = ''; });
            finance = null; AOMSUK.saveFinance(null).catch(() => { });
            const err = form.querySelector('[data-err]'); err.textContent = 'ล้างข้อมูลที่เคยจำไว้แล้ว กรอกใหม่ได้เลย'; err.className = 'text-sm text-green-700';
        });
        $chat.addEventListener('submit', e => {
            const form = e.target.closest('[data-finform]'); if (!form) return;
            e.preventDefault();
            if (busy) return;
            const g = n => { const x = form.querySelector(`[name="${n}"]`); return x && typeof x.value === 'string' ? x.value.trim() : ''; };
            const n = k => { const x = parseFloat(g(k)); return x > 0 ? x : 0; };
            const err = form.querySelector('[data-err]');
            const fail = msg => { err.textContent = msg; err.className = 'text-sm text-red-500'; };
            const target = n('target'), durN = n('durN');
            if (target && !durN) return fail('ใส่ด้วยนะว่าอยากได้ภายในกี่วัน/สัปดาห์/เดือน');
            if (durN && !target) return fail('ใส่ยอดเงินที่ต้องการออมด้วยนะ');
            if (!n('inc') && !target) return fail('กรอกรายได้ หรือยอดที่อยากออมอย่างน้อย 1 อย่างนะ');

            // สร้างข้อมูลการเงินใหม่ทั้งชุด (แทนของเดิม)
            const expenses = [];
            if (n('food')) expenses.push({ cat: 'food', label: 'ค่ากิน', amount: n('food'), period: g('foodPer') || 'day' });
            if (n('travel')) expenses.push({ cat: 'transport', label: 'ค่าเดินทาง', amount: n('travel'), period: g('travelPer') || 'day' });
            if (n('other')) expenses.push({ cat: 'other', label: 'ค่าใช้จ่ายอื่น', amount: n('other'), period: g('otherPer') || 'day' });
            const per = g('incPer') || 'month';
            finance = (n('inc') || expenses.length) ? { income: n('inc') ? { amount: n('inc'), period: per, word: per === 'month' ? 'เงินเดือน' : 'รายได้' } : null, expenses } : null;
            AOMSUK.saveFinance(finance).catch(() => { });
            err.className = 'hidden';

            // ข้อความสรุปฝั่งผู้ใช้
            const parts = [];
            if (n('inc')) parts.push(`รายได้ ${baht(n('inc'))} บาท/${PERIOD_WORD[per]}`);
            expenses.forEach(x => parts.push(`${x.label} ${baht(x.amount)}/${PERIOD_WORD[x.period]}`));
            const item = g('item'), unitWord = { day: 'วัน', week: 'สัปดาห์', month: 'เดือน' }[g('durU')] || 'วัน';
            pendingImage = formImages[form.id] || null; pendingItem = item;
            if (target) parts.push(`อยากออม ${baht(target)} บาท ใน ${durN} ${unitWord}${item ? ` (${item})` : ''}`);
            addUser(parts.join(' · '));

            context = null; awaiting = null;
            if (target) {
                botReply(() => respond(`อยากเก็บ ${target} บาท ใน ${durN} ${unitWord}${item ? ` เพื่อซื้อ ${item}` : ''}`));
            } else {
                botReply(() => {
                    const b = budgetOf(finance);
                    addBot(b ? `${financeLine(finance, b)}<br>จดไว้ให้แล้ว อยากเก็บเงินไว้ซื้ออะไร แล้วอยากได้ภายในกี่วันดี?` : 'จดไว้ให้แล้ว อยากเก็บเงินไว้ซื้ออะไรดี?');
                    setChips(['อยากได้ตั๋วหนังใน 1 อาทิตย์', 'อยากเก็บ 1,000 ใน 1 เดือน', 'อยากเก็บ 5,000 ใน 3 เดือน']);
                });
            }
        });

        // ข้อความต้อนรับ (หลังโหลดข้อมูลผู้ใช้เสร็จ)
        AOMSUK.onReady(() => {
        finance = AOMSUK.finance();
        // มาจากหน้าเพิ่มเป้าหมาย (chat.html?goal=...) -> เติมชื่อ ราคา รูป ให้ในฟอร์ม
        const goalId = new URLSearchParams(location.search).get('goal');
        const gw = goalId && AOMSUK.wishlist.find(w => w.id === goalId);
        if (goalId) history.replaceState(null, '', location.pathname);
        if (gw) {
            addBot(`สวัสดี คุณ ${esc(AOMSUK.displayName())} บันทึก "${esc(gw.name)}" ไว้ให้แล้ว<br><span class="text-[13px] text-gray-600">กรอกรายได้ ค่าใช้จ่าย และอยากได้ภายในกี่วัน แล้วกด "คำนวณให้หน่อย" ได้เลย</span>`);
            showFinanceForm({ item: gw.name, target: gw.price, image: gw.image, title: `วางแผนออมเพื่อ "${esc(gw.name)}"` });
        } else {
            addBot(`สวัสดี คุณ ${esc(AOMSUK.displayName())} ช่วงนี้อยากเก็บเงินไว้ซื้ออะไรเหรอ?<br><span class="text-[13px] text-gray-600">${finance ? 'ข้อมูลที่เคยบอกไว้อยู่ในฟอร์มด้านล่าง ถ้าอะไรเปลี่ยนก็แก้ได้เลย' : 'กรอกฟอร์มด้านล่าง หรือจะพิมพ์เล่ามาเองก็ได้นะ'}</span>`);
            showFinanceForm();
        }
        setChips(EXAMPLES);

        // เปิดจากหน้าอื่นพร้อมคำสั่ง เช่น chat.html?q=ออม 390 บาท ใน 1 เดือน
        const initialQ = new URLSearchParams(location.search).get('q');
        if (initialQ) {
            history.replaceState(null, '', location.pathname);
            setTimeout(() => send(initialQ.slice(0, 200)), 400);
        }
        });
    </script>
</body>
</html>
