<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AOMSUK - ติดตาม</title>
    <!-- โหลดไฟล์เวอร์ชันล่าสุดเสมอ (กันมือถือ/iPad ใช้ไฟล์เก่าที่จำไว้) -->
    <script>(function () { var v = ''; try { v = (localStorage.getItem('aomsuk_build') || '').slice(0, 7); } catch (e) { } var q = v ? '?v=' + v : ''; document.write('<script src="firebase-config.js' + q + '"><\/script><script src="app.js' + q + '"><\/script>'); })();</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 17px; } body, button, input, textarea, select { font-family: 'Google Sans', 'Noto Sans Thai Looped', sans-serif; }
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        /* สไตล์สำหรับกล่องเป้าหมายแบบมีเส้นโค้ง */
        .goal-container {
            background-color: white;
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .goal-header {
            border-bottom: 2px solid #9c8a7e;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .toast-in { animation: toastIn .3s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body class="bg-[#d8eafe] min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Header ด้านบน -->
    <div class="bg-[#9c8a7e] p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
        <button onclick="toggleMenu()" class="text-white text-2xl focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="text-2xl font-bold text-white tracking-widest">AOMSUK</h1>
        <button id="bellBtn" class="text-yellow-400 text-2xl relative focus:outline-none" aria-label="แจ้งเตือน">
            <i class="fa-solid fa-bell"></i>
            <span id="bellBadge" class="hidden absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center"></span>
        </button>
    </div>

    <!-- Backdrop สำหรับ Sidebar -->
    <div id="backdrop" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>

    <!-- Sidebar Menu ด้านซ้าย -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col pt-16">
        <nav class="flex-1">
            <a href="settings.html" class="flex items-center gap-4 px-6 py-5 text-gray-800 font-bold hover:bg-gray-50 border-b border-gray-200">
                <i class="fa-solid fa-circle-user text-2xl text-black"></i>
                <span>บัญชีของฉัน</span>
            </a>
            <a href="dashboard.html" class="flex items-center gap-4 px-6 py-5 text-gray-800 font-bold bg-gray-100 border-l-4 border-[#9c8a7e] border-b border-gray-200">
                <i class="fa-solid fa-paw text-2xl text-black"></i>
                <span>ติดตาม</span>
            </a>
            <a href="chat.html" class="flex items-center gap-4 px-6 py-5 text-gray-800 font-bold hover:bg-gray-50 border-b border-gray-200">
                <i class="fa-solid fa-comment-dots text-2xl text-black"></i>
                <span>แชทบอท</span>
            </a>
            <a href="settings.html" class="flex items-center gap-4 px-6 py-5 text-gray-800 font-bold hover:bg-gray-50 border-b border-gray-200">
                <i class="fa-solid fa-gear text-2xl text-black"></i>
                <span>ตั้งค่า</span>
            </a>
        </nav>
    </div>

    <!-- Content เนื้อหาหน้าติดตาม -->
    <div class="flex-1 px-4 pt-8 pb-20 space-y-4">

        <!-- เงินออมปัจจุบัน -->
        <div class="bg-white rounded-3xl p-6 pr-28 shadow-sm flex items-center relative min-h-[120px]">
            <div class="w-full">
                <p class="text-gray-600 font-medium text-sm">เงินออมปัจจุบัน</p>
                <h2 id="currentSavings" class="text-2xl font-bold text-gray-800">0.00 BATH</h2>
            </div>
            <a href="settings.html#profile" class="absolute right-4 top-[-18px] flex flex-col items-center" aria-label="โปรไฟล์">
                <div id="avatarCircle" class="w-24 h-24 bg-gray-200 rounded-full border-4 border-white shadow-md flex items-center justify-center overflow-hidden text-2xl">
                    <i class="fa-solid fa-cat text-[#9c8a7e]"></i>
                </div>
                <p id="avatarName" class="text-xs text-gray-600 font-semibold mt-1 max-w-[96px] truncate">PEAK</p>
            </a>
        </div>

        <!-- แผนการออม (จากแชทบอท) -->
        <div id="planSection" class="bg-white rounded-3xl p-4 shadow-sm space-y-3"></div>

        <!-- กล่องตารางออมเงิน & รายการออม -->
        <div class="space-y-4">
            <!-- ตารางออมเงิน -->
            <div id="scheduleBox" class="bg-[#9c8a7e] rounded-3xl p-4 text-white shadow-sm border-4 border-[#9c8a7e] scroll-mt-20">
                <h3 class="font-bold text-center mb-3 text-base">ตารางออมเงิน</h3>
                <div id="scheduleList" class="space-y-2 text-sm bg-white text-gray-800 p-4 rounded-2xl max-h-80 overflow-y-auto"></div>
            </div>

            <!-- รายการออม -->
            <div class="bg-[#fcefdc] rounded-3xl p-4 text-gray-800 shadow-sm border-4 border-[#fcefdc]">
                <h3 class="font-bold text-center mb-3 text-base">รายการออม</h3>
                <div id="historyList" class="space-y-2 text-sm bg-[#fdf3e6] p-4 rounded-2xl max-h-80 overflow-y-auto"></div>
            </div>
        </div>

        <!-- เป้าหมายของคุณ (หน้าหลัก) -->
        <div class="goal-container">
            <div class="goal-header">
                <h3 class="font-bold text-[#9c8a7e] text-base">เป้าหมายของคุณ</h3>
            </div>
            <div class="text-right text-[11px] text-gray-500 mb-2">highest price</div>
            <div id="wishTop" class="space-y-4"></div>
            <div id="moreBtnWrap" class="text-center mt-6">
                <button onclick="openGoalPopup()" class="font-bold text-gray-600 text-xs underline decoration-2 underline-offset-4 hover:text-gray-800 transition-colors">
                    เพิ่มเติม.....
                </button>
            </div>
        </div>
    </div>

    <!-- ปุ่มเพิ่มเป้าหมาย (ลอยอยู่มุมขวาล่าง) -->
    <div class="fixed bottom-6 right-6 z-20">
        <a href="add-goal.html" class="bg-[#7b8994] text-white px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 font-bold text-sm hover:bg-[#637079] transition-colors">
            <i class="fa-solid fa-square-plus text-base"></i>
            เพิ่มเป้าหมาย
        </a>
    </div>

    <!-- POPUP (Modal) รายการเป้าหมายทั้งหมด -->
    <div id="goalPopup" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-md overflow-hidden relative shadow-2xl">
            <div class="flex items-center p-4 border-b-2 border-[#9c8a7e] mx-4 mb-2">
                <button onclick="closeGoalPopup()" class="text-xl text-gray-600 focus:outline-none">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h3 class="flex-1 text-center font-bold text-[#9c8a7e] text-base mr-6">เป้าหมายของคุณ</h3>
            </div>
            <div class="px-6 pb-6 pt-2 text-right text-[11px] text-gray-500 mb-1">highest price</div>
            <div id="wishAll" class="px-6 pb-8 space-y-5 overflow-y-auto max-h-[60vh]"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-gray-800/90 text-white text-xs px-4 py-2 rounded-full shadow-lg whitespace-nowrap"></div>

    <script>
        // ---------------- Sidebar & Popup ----------------
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('backdrop').classList.toggle('hidden');
        }
        function openGoalPopup() { document.getElementById('goalPopup').classList.remove('hidden'); }
        function closeGoalPopup() { document.getElementById('goalPopup').classList.add('hidden'); }
        document.getElementById('goalPopup').addEventListener('click', e => { if (e.target.id === 'goalPopup') closeGoalPopup(); });

        // ---------------- ข้อมูลมาจาก Firebase ผ่าน app.js ----------------
        //   AOMSUK.goals    : แผนการออม (จากแชทบอท)
        //   AOMSUK.wishlist : เป้าหมายสิ่งที่อยากซื้อ (จากหน้าเพิ่มเป้าหมาย)
        const A = AOMSUK;
        const ACTIVE_KEY = 'aomsuk_active_goal';
        let activeId = null;
        // เลือกเองได้ระหว่างใช้งาน แต่เปิดหน้าใหม่จะกลับไปยึดเป้าหมายที่ราคาแพงที่สุดเป็นหลัก
        try { activeId = sessionStorage.getItem(ACTIVE_KEY); } catch (e) { }
        const setActive = id => { activeId = id; try { sessionStorage.setItem(ACTIVE_KEY, id || ''); } catch (e) { } };

        // ---------------- Helpers ----------------
        const esc = A.esc, money = A.money, savedOf = A.savedOf;
        const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
        const pad = n => String(n).padStart(2, '0');
        const todayKey = A.dkey(new Date());
        const thShort = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${pad((d.getFullYear() + 543) % 100)}`;
        const weekdayShort = d => d.toLocaleDateString('th-TH', { weekday: 'short' });
        const FREQ = { daily: 'รายวัน', weekly: 'รายสัปดาห์', monthly: 'รายเดือน' };
        // รายการในส่วนแผน = แผนการออม + เป้าหมายที่เพิ่มเองแต่ยังไม่มีตาราง
        const norm = s => String(s || '').trim().toLowerCase();
        const hasPlan = w => A.goals.some(g => g.wishId === w.id || norm(g.title) === norm(w.name));
        // เรียงจากราคาแพงสุด -> ถูกสุด
        const entries = () => [
            ...A.goals.map(g => ({ key: g.id, kind: 'plan', title: g.title, price: +g.target || 0, g })),
            ...A.wishlist.filter(w => !hasPlan(w)).map(w => ({ key: 'w:' + w.id, kind: 'wish', title: w.name, price: +w.price || 0, w }))
        ].sort((a, b) => b.price - a.price);
        const activeEntry = () => { const es = entries(); return es.find(e => e.key === activeId) || es[0] || null; };
        const activeGoal = () => { const e = activeEntry(); return e && e.kind === 'plan' ? e.g : null; };
        const planLink = w => `chat.html?q=${encodeURIComponent(`ออม ${w.price} บาท ใน 1 เดือน เพื่อซื้อ ${w.name}`)}`;
        const wishThumb = (w, cls) => w.image ? `<img src="${w.image}" alt="" class="${cls} rounded-2xl object-cover shrink-0">` : `<span class="${cls} rounded-2xl bg-[#f4efe9] flex items-center justify-center text-2xl shrink-0">${esc(w.emoji || '🎯')}</span>`;

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.remove('hidden'); t.classList.remove('toast-in'); void t.offsetWidth; t.classList.add('toast-in');
            clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
        }

        // ---------------- Render: เงินออมปัจจุบัน ----------------
        function renderSavings() {
            document.getElementById('currentSavings').textContent = `${money(A.totalSavings())} BATH`;
            document.getElementById('avatarName').textContent = A.displayName().toUpperCase();
            const photo = A.photo(), circle = document.getElementById('avatarCircle');
            const want = photo ? `<img src="${photo}" alt="" class="w-full h-full object-cover">` : '<i class="fa-solid fa-cat text-[#9c8a7e]"></i>';
            if (circle.dataset.photo !== (photo || '')) { circle.innerHTML = want; circle.dataset.photo = photo || ''; }
        }

        // ---------------- Render: แผนการออม ----------------
        function pillsHTML(curKey) {
            const es = entries();
            if (es.length < 2) return '';
            return `<div class="flex gap-2 overflow-x-auto pb-1">${es.map(x => `
                <button data-goal="${esc(x.key)}" class="shrink-0 text-xs px-3 py-1.5 rounded-full border ${x.key === curKey ? 'bg-[#9c8a7e] text-white border-[#9c8a7e]' : 'bg-white text-[#7a6a5f] border-[#d9cfc7]'}">${x.kind === 'wish' ? '🎯 ' : ''}${esc(x.title)}</button>`).join('')}</div>`;
        }
        function renderPlan() {
            const el = document.getElementById('planSection');
            const e = activeEntry();
            if (e && e.kind === 'wish') {
                // เป้าหมายที่เพิ่มเอง ยังไม่มีตารางออม
                const w = e.w, total = A.totalSavings(), pct = Math.min(100, Math.round(total / w.price * 100));
                el.innerHTML = `${pillsHTML(e.key)}
                    <div class="flex items-start gap-3">
                        ${wishThumb(w, 'w-16 h-16')}
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-gray-800 text-base truncate">${esc(w.name)}</p>
                            <p class="text-xs text-gray-500">เป้าหมาย ${(+w.price).toLocaleString('th-TH')} บาท · ยังไม่มีตารางออม</p>
                        </div>
                        <button data-delwish="${esc(w.id)}" class="text-gray-400 hover:text-red-500 text-base px-1" aria-label="ลบเป้าหมาย"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1"><span class="text-gray-600">เงินออมรวม ${money(total)} / ${money(w.price)} ฿</span><span class="font-bold text-[#9c8a7e]">${pct}%</span></div>
                        <div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-[#9c8a7e] rounded-full" style="width:${pct}%"></div></div>
                    </div>
                    <a href="${planLink(w)}" class="block text-center bg-[#9c8a7e] text-white font-bold rounded-full py-2.5"><i class="fa-solid fa-comment-dots mr-1"></i>ให้แชทบอทจัดตารางออมให้</a>`;
                return;
            }
            const g = activeGoal();
            if (!g) {
                el.innerHTML = `<div class="text-center py-2">
                    <p class="text-gray-600 text-xs mb-3">ยังไม่มีแผนการออมเลย ให้แชทบอทช่วยจัดตารางให้สิ 🐷</p>
                    <a href="chat.html" class="inline-flex items-center gap-2 bg-[#9c8a7e] text-white text-xs font-bold px-4 py-2 rounded-full"><i class="fa-solid fa-comment-dots"></i> สร้างแผนกับแชทบอท</a>
                </div>`;
                return;
            }
            const saved = savedOf(g), pct = Math.min(100, Math.round(saved / g.target * 100));
            const done = g.schedule.filter(i => i.saved).length;
            const left = g.schedule.filter(i => !i.saved && i.date >= todayKey).length;
            const missed = g.schedule.filter(i => !i.saved && i.date < todayKey).length;
            const pills = pillsHTML(g.id);
            el.innerHTML = `${pills}
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <p class="font-bold text-gray-800 text-base">${esc(g.title)}</p>
                        <p class="text-xs text-gray-500">${FREQ[g.frequency] || ''} · ${thShort(parseKey(g.startDate))} – ${thShort(parseKey(g.endDate))}</p>
                    </div>
                    <button data-del="${esc(g.id)}" class="text-gray-400 hover:text-red-500 text-base px-1" aria-label="ลบแผน"><i class="fa-solid fa-trash-can"></i></button>
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span class="text-gray-600">${money(saved)} / ${money(g.target)} ฿</span><span class="font-bold text-[#9c8a7e]">${pct}%</span></div>
                    <div class="h-3 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-[#9c8a7e] rounded-full transition-all duration-500" style="width:${pct}%"></div></div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-[#f4efe9] rounded-xl py-2"><div class="font-bold text-lg text-gray-800">${done}</div>ออมแล้ว</div>
                    <div class="bg-[#f4efe9] rounded-xl py-2"><div class="font-bold text-lg text-gray-800">${left}</div>เหลืออีก</div>
                    <div class="bg-[#f4efe9] rounded-xl py-2"><div class="font-bold text-lg ${missed ? 'text-[#cc9c94]' : 'text-gray-800'}">${missed}</div>พลาดไป</div>
                </div>
                ${pct >= 100 ? '<p class="text-center text-xs font-bold text-green-600">🎉 ถึงเป้าหมายแล้ว เก่งมาก!</p>' : ''}`;
        }

        // ---------------- Render: ตารางออมเงิน ----------------
        let lastScrolledGoal = null;
        function renderSchedule() {
            const el = document.getElementById('scheduleList');
            const g = activeGoal();
            if (!g) {
                const e = activeEntry();
                el.innerHTML = e && e.kind === 'wish'
                    ? `<div class="text-center py-4"><p class="text-sm text-gray-600 mb-3">"${esc(e.w.name)}" ยังไม่มีตารางออม</p><a href="${planLink(e.w)}" class="inline-block bg-[#9c8a7e] text-white font-semibold rounded-full px-5 py-2">จัดตารางกับแชทบอท</a></div>`
                    : '<p class="text-center text-sm text-gray-500 py-4">ยังไม่มีตาราง</p>';
                lastScrolledGoal = null;
                return;
            }
            const keepScroll = el.scrollTop;
            el.innerHTML = g.schedule.map((it, i) => {
                const d = parseKey(it.date), isToday = it.date === todayKey, past = it.date < todayKey;
                const icon = it.saved ? 'fa-solid fa-square-check text-[#9c8a7e]' : past ? 'fa-regular fa-square text-[#cc9c94]' : 'fa-solid fa-square text-gray-400';
                return `<div data-idx="${i}" class="flex justify-between items-center gap-2 py-1 ${i < g.schedule.length - 1 ? 'border-b border-gray-200 pb-2' : ''} ${isToday ? 'bg-yellow-50 -mx-2 px-2 rounded-lg' : ''}">
                    <span class="font-bold text-sm leading-tight">${d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' })}${isToday ? ' <span class="text-[11px] font-semibold text-yellow-700 bg-yellow-200 rounded-full px-2 py-0.5 ml-1">วันนี้</span>' : ''}</span>
                    <button data-tick="${i}" class="font-bold text-sm text-[#6b7280] whitespace-nowrap flex items-center gap-2">${money(it.amount)} ฿ <i class="${icon} text-xl"></i></button>
                </div>`;
            }).join('');
            if (lastScrolledGoal === g.id) { el.scrollTop = keepScroll; return; }
            lastScrolledGoal = g.id;
            // เลื่อนไปยังวันนี้ / รายการที่ยังไม่ออม
            const idx = Math.max(0, g.schedule.findIndex(it => it.date >= todayKey || !it.saved));
            const row = el.querySelector(`[data-idx="${idx}"]`);
            if (row) el.scrollTop = row.offsetTop - el.offsetTop - 8;
        }

        // ---------------- Render: รายการออม (ประวัติ) ----------------
        function renderHistory() {
            const el = document.getElementById('historyList');
            const rows = [];
            A.goals.forEach(g => g.schedule.forEach((it, idx) => {
                const ref = `${g.id}|${idx}`;
                if (it.saved) {
                    const at = it.savedAt ? new Date(it.savedAt) : parseKey(it.date);
                    const late = it.savedAt && A.dkey(at) > it.date;
                    rows.push({ ref, sort: at.getTime(), emoji: it.emoji || (late ? '😉' : '😁'), date: thShort(at), time: it.savedAt ? `${pad(at.getHours())}:${pad(at.getMinutes())}` : '-', amount: it.amount });
                } else if (it.date < todayKey) {
                    const d = parseKey(it.date);
                    rows.push({ ref, sort: d.getTime() + 86399000, emoji: it.emoji || '😔', date: thShort(d), time: 'not found', amount: 0 });
                }
            }));
            rows.sort((a, b) => b.sort - a.sort);
            if (!rows.length) { el.innerHTML = '<p class="text-center text-gray-500 py-4">ยังไม่มีรายการ<br>ติ๊กช่องในตารางเมื่อออมแล้ว</p>'; return; }
            const hint = '<p class="text-xs text-gray-500 text-center -mt-1 mb-1">แตะอิโมจิเพื่อเปลี่ยนเป็นแบบที่ชอบ</p>';
            el.innerHTML = hint + rows.slice(0, 30).map((r, i, arr) => `
                <div class="flex justify-between items-center py-1 ${i < arr.length - 1 ? 'border-b border-gray-300 pb-2' : ''}">
                    <div class="flex items-center gap-3 min-w-0"><button type="button" data-emo="${esc(r.ref)}" class="text-2xl w-11 h-11 shrink-0 rounded-full bg-white/70 hover:bg-white border border-dashed border-[#e6d8c6] flex items-center justify-center" aria-label="เปลี่ยนอิโมจิ">${r.emoji}</button><div><p class="font-bold text-gray-700 text-sm">${r.date}</p><p class="text-xs text-gray-500">${r.time}</p></div></div>
                    <span class="font-bold text-base text-gray-800 whitespace-nowrap ml-2">${money(r.amount)} ฿</span>
                </div>`).join('');
        }

        // ---------------- Render: เป้าหมายของคุณ (wishlist) ----------------
        function wishRow(w, withStatus) {
            const need = Math.max(0, w.price - A.totalSavings());
            const status = need > 0
                ? `<div class="text-[11px] text-[#cc9c94]">คุณยังขาดอีก ${need.toLocaleString('th-TH', { maximumFractionDigits: 2 })} บาท</div>`
                : `<div class="text-[11px] text-gray-500">คุณสามารถซื้อสินค้านี้ได้!</div>`;
            return `<div class="flex justify-between items-center">
                <div class="flex items-center gap-3 min-w-0">${w.image
                    ? `<img src="${w.image}" alt="" class="w-12 h-12 rounded-xl object-cover shrink-0">`
                    : `<span class="text-2xl w-12 text-center shrink-0">${esc(w.emoji || '🎯')}</span>`}<span class="font-bold text-gray-700 text-sm truncate">${esc(w.name)}</span></div>
                <div class="flex items-center gap-2 shrink-0">
                    ${withStatus ? `<div class="text-right"><div class="font-bold text-gray-700">${(+w.price).toLocaleString('th-TH')} THB</div>${status}</div>` : `<span class="font-bold text-gray-700">${(+w.price).toLocaleString('th-TH')} THB</span>`}
                    <button data-editwish="${esc(w.id)}" class="w-9 h-9 rounded-full bg-[#f4efe9] text-[#7a6a5f] hover:bg-[#9c8a7e] hover:text-white flex items-center justify-center" aria-label="แก้ไขเป้าหมาย"><i class="fa-solid fa-pen"></i></button>
                </div>
            </div>`;
        }
        function renderWishlist() {
            const sorted = [...A.wishlist].sort((a, b) => b.price - a.price);
            const empty = `<div class="text-center py-2"><p class="text-xs text-gray-500 mb-2">ยังไม่มีเป้าหมาย</p><a href="add-goal.html" class="text-xs font-bold text-[#9c8a7e] underline">+ เพิ่มเป้าหมายแรก</a></div>`;
            document.getElementById('wishTop').innerHTML = sorted.length ? sorted.slice(0, 2).map(w => wishRow(w, false)).join('') : empty;
            document.getElementById('wishAll').innerHTML = sorted.length ? sorted.map(w => wishRow(w, true)).join('') : empty;
            document.getElementById('moreBtnWrap').classList.toggle('hidden', !sorted.length);
        }

        // ---------------- Events ----------------
        document.addEventListener('click', e => {
            const tick = e.target.closest('[data-tick]');
            if (tick) {
                const g = activeGoal(), it = g.schedule[+tick.dataset.tick];
                it.saved = !it.saved;
                if (it.saved) it.savedAt = new Date().toISOString(); else delete it.savedAt;
                g.savedAmount = Math.round(savedOf(g) * 100) / 100;
                renderAll();
                A.saveGoal(g).catch(err => toast('บันทึกไม่สำเร็จ: ' + err.message));
                const pct = Math.round(savedOf(g) / g.target * 100);
                toast(it.saved ? (pct >= 100 ? '🎉 ถึงเป้าหมายแล้ว เก่งมาก!' : `เก่งมาก! ออมแล้ว ${money(it.amount)} ฿ (${pct}%)`) : 'ยกเลิกการติ๊กแล้ว');
                return;
            }
            const pill = e.target.closest('[data-goal]');
            if (pill) { setActive(pill.dataset.goal); renderAll(); return; }
            const ew = e.target.closest('[data-editwish]');
            if (ew) { A.go(`add-goal.html?edit=${encodeURIComponent(ew.dataset.editwish)}`); return; }
            const dw = e.target.closest('[data-delwish]');
            if (dw) {
                const w = A.wishlist.find(x => x.id === dw.dataset.delwish);
                if (w && confirm(`ลบเป้าหมาย "${w.name}" ใช่ไหม?`)) A.deleteWish(w.id).then(() => toast('ลบเป้าหมายแล้ว'), err => toast('ลบไม่สำเร็จ: ' + err.message));
                return;
            }
            const del = e.target.closest('[data-del]');
            if (del) {
                const g = A.goals.find(x => x.id === del.dataset.del);
                if (g && confirm(`ลบแผน "${g.title}" ใช่ไหม? ประวัติการออมของแผนนี้จะหายไปด้วย`)) {
                    A.deleteGoal(g.id).then(() => toast('ลบแผนแล้ว'), err => toast('ลบไม่สำเร็จ: ' + err.message));
                }
            }
        });

        // ---------------- เลือกอิโมจิของรายการออมเอง ----------------
        const EMOJI_CHOICES = ['🥺', '♥️', '✨', '😳', '💐', '🌸', '🪷', '🌷', '🌻', '🎀', '😍', '🥹', '😻', '🫶🏻', '🙏🏻', '❤️', '💗', '💖', '💝', '🤍', '⭐️', '🌈', '🏆', '🛒'];
        const picker = document.createElement('div');
        picker.id = 'emojiPicker';
        picker.className = 'hidden fixed z-[70] bg-white rounded-2xl shadow-2xl border border-gray-100 p-3 w-[280px]';
        picker.innerHTML = `<p class="text-sm font-semibold text-gray-700 mb-2">เลือกอิโมจิ</p>
            <div class="grid grid-cols-6 gap-1">${EMOJI_CHOICES.map(e => `<button type="button" data-pick="${e}" class="text-2xl h-10 rounded-lg hover:bg-[#f4efe9]">${e}</button>`).join('')}</div>
            <button type="button" data-pick="" class="w-full mt-2 text-xs text-gray-500 hover:text-gray-800">ใช้แบบอัตโนมัติ</button>`;
        document.body.appendChild(picker);
        let pickRef = null;
        const closePicker = () => { picker.classList.add('hidden'); pickRef = null; };
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-emo]');
            if (b) {
                e.stopPropagation();
                pickRef = b.dataset.emo;
                const r = b.getBoundingClientRect();
                picker.classList.remove('hidden'); openedAt = Date.now();
                const left = Math.min(window.innerWidth - 290, Math.max(10, r.left));
                const top = r.bottom + 8 + 250 > window.innerHeight ? Math.max(10, r.top - 8 - picker.offsetHeight) : r.bottom + 8;
                picker.style.left = left + 'px'; picker.style.top = top + 'px';
                return;
            }
            const p = e.target.closest('[data-pick]');
            if (p && pickRef) {
                const [gid, idx] = pickRef.split('|'); const g = A.goals.find(x => x.id === gid);
                if (g && g.schedule[+idx]) {
                    if (p.dataset.pick) g.schedule[+idx].emoji = p.dataset.pick; else delete g.schedule[+idx].emoji;
                    renderHistory();
                    A.saveGoal(g).catch(err => toast('บันทึกไม่สำเร็จ: ' + err.message));
                }
                closePicker(); return;
            }
            if (!e.target.closest('#emojiPicker')) closePicker();
        }, true);
        let openedAt = 0;
        window.addEventListener('scroll', () => { if (Date.now() - openedAt > 400) closePicker(); }, { passive: true });

        function renderAll() { renderSavings(); renderPlan(); renderSchedule(); renderHistory(); renderWishlist(); }
        A.onReady(renderAll);
        A.onChange(renderAll);
    </script>
</body>
</html>
